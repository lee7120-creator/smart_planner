<!DOCTYPE html>

<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --surface3:#e2e8f0;
      --border:#e2e8f0; --border2:#f1f5f9;
      --text:#0f172a; --text2:#475569; --text3:#94a3b8;
      --primary:#6366f1; --primary-h:#4f46e5; --primary-l:#eef2ff;
      --green:#10b981; --red:#ef4444; --orange:#f97316; --yellow:#f59e0b;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
      --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
    }
    [data-theme="dark"] {
      --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --surface3:#0f172a;
      --border:#334155; --border2:#1e293b;
      --text:#f8fafc; --text2:#94a3b8; --text3:#475569;
      --primary:#818cf8; --primary-h:#6366f1; --primary-l:#1e1b4b;
      --green:#10b981; --red:#ef4444; --orange:#f97316; --yellow:#f59e0b;
      --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
      --shadow-md:0 4px 6px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.3);
      --shadow-lg:0 10px 15px rgba(0,0,0,.5),0 4px 6px rgba(0,0,0,.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); transition:background .2s,color .2s; }

    /* ─── Header ─── */
    .header {
      background:var(--surface); border-bottom:none;
      padding:0 24px; height:60px; display:flex; align-items:center; gap:12px;
      position:sticky; top:0; z-index:300; box-shadow:0 1px 0 var(--border);
    }
    .header-title { font-size:18px; font-weight:700; letter-spacing:-0.3px; color:var(--primary); white-space:nowrap; margin-right:4px; }
    .view-toggle { display:flex; background:var(--surface2); border-radius:8px; padding:3px; gap:2px; }
    .view-btn {
      padding:4px 12px; border:none; border-radius:8px; font-size:12px; font-weight:500;
      cursor:pointer; color:var(--text2); background:transparent; font-family:inherit; transition:all .2s;
    }
    .view-btn.active { background:var(--surface); color:var(--primary); box-shadow:var(--shadow); }
    .nav-group { display:flex; align-items:center; gap:6px; }
    .nav-btn {
      background:var(--surface); border:1px solid var(--border); border-radius:8px;
      padding:5px 12px; height:32px; font-size:13px; cursor:pointer; color:var(--text2);
      transition:background .2s; font-family:inherit; display:flex; align-items:center;
    }
    .nav-btn:hover { background:var(--surface2); }
    .today-btn { background:var(--primary); color:#fff; border-color:var(--primary); letter-spacing:-0.2px; }
    .today-btn:hover { background:var(--primary-h); }
    .week-label { font-size:13px; font-weight:600; min-width:160px; text-align:center; color:var(--text); white-space:nowrap; }
    .search-wrap { flex:1; max-width:260px; position:relative; }
    .search-input {
      width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:6px 12px 6px 32px; font-size:13px; outline:none; color:var(--text); font-family:inherit;
      transition:border-color .15s, box-shadow .15s;
    }
    .search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-l); }
    .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:14px; pointer-events:none; }
    .header-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .icon-btn {
      background:none; border:1px solid var(--border); border-radius:7px;
      width:32px; height:32px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:15px; color:var(--text2); transition:all .15s;
    }
    .icon-btn:hover { background:var(--surface2); }
    .icon-btn.menu-open { background:var(--surface2); color:var(--primary); border-color:var(--primary); transform:rotate(90deg); }
    .progress-pill {
      font-size:11px; color:var(--text2); white-space:nowrap;
      display:flex; align-items:center; gap:6px;
    }
    .progress-bar-wrap { width:60px; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
    .progress-bar-fill { height:100%; background:var(--green); border-radius:3px; transition:width .4s; }

    /* ─── Week view ─── */
    .calendar-wrap { padding:16px; overflow-x:auto; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(148px,1fr)); gap:8px; min-width:1060px; }
    .day-col { background:var(--surface); border:1px solid var(--border); border-radius:16px; display:flex; flex-direction:column; min-height:560px; overflow:hidden; transition:box-shadow .2s; box-shadow:var(--shadow); }
    .day-col:hover { box-shadow:var(--shadow-md); }
    .day-col.is-today { border:2px solid var(--primary); box-shadow:0 0 0 4px var(--primary-l); }
    .day-col.is-weekend { background:color-mix(in srgb, var(--surface) 95%, var(--red) 5%); }

    .day-header { padding:14px 14px 10px; text-align:center; border-bottom:1px solid var(--border2); }
    .day-name { font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text3); text-transform:uppercase; margin-bottom:4px; }
    .is-weekend .day-name { color:var(--red); opacity:.7; }
    .day-num-wrap { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; }
    .is-today .day-num-wrap { background:var(--primary); }
    .day-num { font-size:22px; font-weight:700; color:var(--text); }
    .is-today .day-num { color:#fff; }
    .is-weekend:not(.is-today) .day-num { color:var(--red); }
    .day-month { font-size:10px; color:var(--text3); margin-top:1px; }
    .day-meta { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:5px; }
    .task-count-badge {
      font-size:10px; font-weight:600; padding:1px 7px; border-radius:10px;
      background:var(--primary-l); color:var(--primary);
    }
    .day-progress { width:40px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .day-progress-fill { height:100%; background:var(--green); border-radius:2px; transition:width .3s; }

    /* ─── Tasks ─── */
    .tasks-list { flex:1; padding:6px; overflow-y:auto; }
    .task-item {
      display:flex; align-items:flex-start; gap:5px; padding:6px 6px;
      border-radius:8px; position:relative; transition:background .12s, box-shadow .12s;
    }
    .task-item:hover { background:var(--surface2); box-shadow:0 1px 4px rgba(0,0,0,.05); }
    .task-item:hover .task-actions { opacity:1; }

    .task-star { font-size:13px; cursor:pointer; color:var(--border); flex-shrink:0; margin-top:2px; transition:color .15s,transform .15s; user-select:none; }
    .task-star.on { color:var(--yellow); }
    .task-star:hover { transform:scale(1.2); color:var(--yellow); }

    .color-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:5px; }

    .task-cb {
      width:16px; height:16px; border:1.5px solid var(--border); border-radius:5px;
      flex-shrink:0; margin-top:1px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      background:var(--surface); transition:all .15s;
    }
    .task-cb:hover { border-color:var(--green); background:color-mix(in srgb,var(--green) 8%,var(--surface)); transform:scale(1.08); }
    .task-cb.checked { background:var(--green); border-color:var(--green); box-shadow:0 1px 3px rgba(16,185,129,.3); animation:cbPop .25s ease; }
    .task-cb.checked::after { content:'✓'; color:#fff; font-size:9px; font-weight:700; }
    @keyframes cbPop { 0%{transform:scale(.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }

    .task-body { flex:1; min-width:0; }
    .task-text { font-size:13px; line-height:1.5; word-break:break-word; color:var(--text); }
    .task-text.done { text-decoration:line-through; color:var(--text3); }

    .repeat-badge {
      display:inline-flex; align-items:center; gap:2px; font-size:9px;
      color:var(--primary); background:var(--primary-l); border-radius:4px;
      padding:1px 5px; margin-top:2px; font-weight:600;
    }

    .subtask-list { margin-top:2px; }
    .task-item.sub { margin-left:20px; }
    .task-item.sub .task-cb { width:13px; height:13px; }
    .task-item.sub .task-text { font-size:11px; color:var(--text2); }

    .task-actions { display:flex; gap:2px; opacity:0; transition:opacity .12s; flex-shrink:0; }
    .task-act-btn {
      width:20px; height:20px; border:none; background:none; cursor:pointer;
      border-radius:4px; font-size:11px; color:var(--text3); display:flex;
      align-items:center; justify-content:center; transition:all .12s;
    }
    .task-act-btn:hover { background:var(--border); color:var(--text); }
    .task-act-btn.del:hover { background:var(--red); color:#fff; }
    .task-act-btn.move:hover { background:var(--primary-l); color:var(--primary); }

    /* ─── Move popup ─── */
    .move-popup {
      position:absolute; right:0; top:100%; z-index:400;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      box-shadow:var(--shadow-lg,0 10px 25px rgba(0,0,0,.15)); padding:6px;
      display:flex; flex-direction:column; gap:2px; min-width:150px;
    }
    .move-opt {
      display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px;
      font-size:12px; color:var(--text); cursor:pointer; border:none; background:none;
      font-family:inherit; text-align:left; transition:background .1s;
    }
    .move-opt:hover { background:var(--surface2); }
    .move-opt .move-opt-date { font-size:10px; color:var(--text3); margin-left:auto; }
    .move-popup-divider { height:1px; background:var(--border); margin:3px 0; }
    .add-sub-btn {
      display:flex; align-items:center; gap:2px; font-size:10px; color:var(--text3);
      cursor:pointer; margin:2px 0 0 20px; background:none; border:none;
      padding:1px 4px; border-radius:4px; font-family:inherit; transition:color .12s;
    }
    /* 호버 가능한 기기(데스크탑)에서만 호버 시 노출, 터치 기기에서는 항상 표시 */
    @media (hover:hover) {
      .add-sub-btn { display:none; }
      .task-item:hover .add-sub-btn { display:flex; }
    }
    .add-sub-btn:hover { color:var(--primary); }

    /* empty state */
    .day-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 8px; color:var(--text3); gap:4px; }
    .day-empty-icon { font-size:22px; opacity:.4; }
    .day-empty-text { font-size:11px; }

    /* add task btn */
    .add-task-btn {
      display:flex; align-items:center; gap:4px; width:calc(100% - 12px); margin:6px;
      padding:5px 8px; border:1.5px dashed var(--border2); border-radius:10px;
      background:none; font-size:12px; color:var(--text3); cursor:pointer;
      transition:all .15s; font-family:inherit;
    }
    .add-task-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-l); }

    /* input form */
    .input-form { padding:6px 8px 10px; border-top:1px solid var(--border2); }
    .input-row { display:flex; gap:4px; margin-bottom:5px; }
    .task-input {
      flex:1; border:1px solid var(--border); border-radius:10px; padding:8px 12px;
      font-size:12px; font-family:inherit; outline:none; background:var(--surface);
      color:var(--text); transition:border-color .15s, box-shadow .15s;
    }
    .task-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-l); }
    .star-toggle { background:none; border:none; font-size:18px; cursor:pointer; color:var(--border); line-height:1; transition:color .15s; padding:0 2px; }
    .star-toggle.on { color:var(--yellow); }
    .color-picker { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:5px; }
    .cp-dot { width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .1s; }
    .cp-dot:hover { transform:scale(1.15); }
    .cp-dot.selected { border-color:var(--text); }
    .repeat-selector { display:flex; gap:3px; margin-bottom:5px; }
    .repeat-opt {
      flex:1; padding:4px 0; font-size:11px; border:1px solid var(--border);
      border-radius:6px; cursor:pointer; text-align:center; color:var(--text2);
      background:var(--surface); transition:all .15s; font-family:inherit; font-weight:500;
    }
    .repeat-opt.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .priority-selector { display:flex; gap:3px; margin-bottom:5px; }
    .priority-opt {
      flex:1; padding:4px 0; font-size:14px; border:1px solid var(--border);
      border-radius:6px; cursor:pointer; text-align:center;
      background:var(--surface); transition:all .15s; font-family:inherit; line-height:1;
    }
    .priority-opt.active { border-color:var(--text); background:var(--surface2); box-shadow:0 0 0 2px var(--surface3) inset; }
    .priority-flag { font-size:11px; margin-right:3px; flex-shrink:0; }
    .tag-chips { margin-top:3px; display:flex; flex-wrap:wrap; gap:4px; }
    .tag-chip {
      font-size:10px; padding:1px 7px; border-radius:10px; background:var(--primary-l);
      color:var(--primary); cursor:pointer; font-weight:600; transition:all .12s;
    }
    .tag-chip:hover { background:var(--primary); color:#fff; }
    .checklist-badge {
      display:inline-flex; align-items:center; gap:2px; font-size:9px; font-weight:700;
      color:var(--text2); background:var(--surface2); border-radius:4px;
      padding:1px 5px; margin-top:2px;
    }

    /* ─── Drag & drop ─── */
    .task-item[draggable="true"] { cursor:grab; }
    .task-item.dragging { opacity:.35; }
    .day-col.drag-over { border-color:var(--primary) !important; box-shadow:0 0 0 3px var(--primary-l) !important; }
    .task-item.drag-target { box-shadow:inset 0 2px 0 var(--primary) !important; }

    /* ─── 마감시간 ─── */
    .time-badge {
      display:inline-flex; align-items:center; font-size:9px; font-weight:700;
      color:var(--primary); background:var(--primary-l); border-radius:4px;
      padding:1px 5px; margin-right:3px; margin-top:2px; flex-shrink:0;
      font-variant-numeric:tabular-nums;
    }
    .time-badge.overdue { color:#fff; background:var(--red); }
    .time-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    .time-row-label { font-size:11px; color:var(--text3); }
    .time-input {
      border:1px solid var(--border); border-radius:6px; padding:3px 6px;
      font-size:12px; font-family:inherit; background:var(--surface); color:var(--text); outline:none;
    }
    .time-input:focus { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-l); }
    .time-clear-btn { background:none; border:none; cursor:pointer; color:var(--text3); font-size:11px; padding:2px 4px; }
    .time-clear-btn:hover { color:var(--red); }

    /* ─── Focus view ─── */
    .focus-wrap { max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:18px; padding:4px 0; }
    .focus-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); }
    .focus-section-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border2); }
    .focus-list { padding:0; overflow:visible; }
    .focus-date-badge { font-size:9px; color:var(--text3); background:var(--surface2); border-radius:4px; padding:1px 5px; margin-top:2px; display:inline-block; }
    .focus-empty { text-align:center; padding:24px; color:var(--text3); font-size:13px; }

    /* ─── Day view ─── */
    .day-view-wrap { max-width:620px; margin:0 auto; padding:16px; }
    .day-view-wrap .day-col { min-height:420px; }

    /* ─── Year view ─── */
    .year-wrap { padding:16px; }
    .year-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:1200px; margin:0 auto; }
    @media (max-width:1059px) { .year-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:768px) { .year-grid { grid-template-columns:repeat(2,1fr); gap:10px; } }
    @media (max-width:480px) { .year-grid { grid-template-columns:1fr; } }
    .year-month {
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:12px; box-shadow:var(--shadow); cursor:pointer; transition:all .15s;
    }
    .year-month:hover { border-color:var(--primary); box-shadow:var(--shadow-md),0 0 0 2px var(--primary-l); }
    .year-month-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; }
    .year-month-title.cur { color:var(--primary); }
    .year-mini-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
    .year-dow { font-size:9px; text-align:center; color:var(--text3); padding:1px 0; font-weight:600; }
    .year-day {
      font-size:10px; text-align:center; padding:3px 0 5px; border-radius:5px;
      color:var(--text2); position:relative; cursor:pointer; line-height:1.2;
    }
    .year-day:hover { background:var(--primary-l); color:var(--primary); }
    .year-day.weekend { color:var(--red); opacity:.75; }
    .year-day.other { visibility:hidden; }
    .year-day.is-today { background:var(--primary); color:#fff; font-weight:700; opacity:1; }
    .year-day.has-tasks::after {
      content:''; position:absolute; bottom:1px; left:50%; transform:translateX(-50%);
      width:3px; height:3px; border-radius:50%; background:var(--primary);
    }
    .year-day.is-today.has-tasks::after { background:#fff; }

    /* ─── Timeline (간트) view ─── */
    .gantt-wrap { padding:16px; }
    .gantt-scroller {
      overflow-x:auto; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; box-shadow:var(--shadow); padding:6px 0;
    }
    .gantt-row { display:grid; align-items:stretch; min-width:760px; }
    .gantt-row:not(.gantt-header):hover { background:var(--surface2); }
    .gantt-header { position:sticky; top:0; background:var(--surface); z-index:5; border-bottom:1px solid var(--border); }
    .gantt-hdr-cell { font-size:10px; font-weight:700; color:var(--text3); text-align:center; padding:6px 0; }
    .gantt-day-num.weekend { color:var(--red); opacity:.7; }
    .gantt-day-num.is-today { color:#fff; background:var(--primary); border-radius:6px 6px 0 0; }
    .gantt-name-cell {
      display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text);
      padding:4px 10px; overflow:hidden; cursor:pointer;
      position:sticky; left:0; background:inherit; z-index:2;
      background:var(--surface); border-right:1px solid var(--border2);
    }
    .gantt-row:not(.gantt-header):hover .gantt-name-cell { background:var(--surface2); }
    .gantt-name-cell.gantt-hdr-cell { text-align:left; }
    .gantt-name-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gantt-cell { border-right:1px solid var(--border2); display:flex; align-items:center; padding:3px 1px; min-height:24px; }
    .gantt-cell.weekend { background:color-mix(in srgb, var(--surface) 96%, var(--red) 4%); }
    .gantt-cell.is-today { background:var(--primary-l); }
    .gantt-bar {
      width:100%; height:12px; border-radius:6px; background:var(--primary);
      cursor:pointer; transition:transform .1s, opacity .1s;
    }
    .gantt-bar:hover { transform:scaleY(1.25); }
    .gantt-bar.done { opacity:.3; }

    /* ─── Trash modal ─── */
    .trash-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:var(--surface2); }
    .trash-info { flex:1; min-width:0; }
    .trash-text { font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .trash-text.done { text-decoration:line-through; color:var(--text3); }
    .trash-meta { font-size:10px; color:var(--text3); margin-top:2px; }
    .trash-actions { display:flex; gap:4px; flex-shrink:0; }
    .trash-act-btn {
      border:1px solid var(--border); background:var(--surface); border-radius:6px;
      padding:4px 8px; font-size:11px; cursor:pointer; color:var(--text2); font-family:inherit; transition:all .12s;
    }
    .trash-act-btn:hover { background:var(--primary-l); color:var(--primary); border-color:var(--primary); }
    .trash-act-btn.del:hover { background:var(--red); color:#fff; border-color:var(--red); }
    .trash-empty { text-align:center; padding:30px; color:var(--text3); font-size:13px; }

    /* ─── Pomodoro widget ─── */
    .pomodoro-widget {
      position:fixed; bottom:16px; left:16px; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:14px 18px; box-shadow:var(--shadow-lg); z-index:200;
      flex-direction:column; gap:8px; min-width:160px; display:none;
    }
    .pomodoro-widget.active { display:flex; }
    .pomodoro-close { position:absolute; top:6px; right:8px; background:none; border:none; cursor:pointer; color:var(--text3); font-size:11px; padding:2px; }
    .pomodoro-task { font-size:11px; color:var(--text2); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 14px; }
    .pomodoro-time { font-size:30px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; color:var(--primary); letter-spacing:1px; }
    .pomodoro-controls { display:flex; gap:6px; }
    .pomodoro-ctrl-btn { flex:1; border:1px solid var(--border); background:var(--surface2); border-radius:8px; padding:5px; font-size:11px; cursor:pointer; color:var(--text2); font-family:inherit; transition:all .12s; }
    .pomodoro-ctrl-btn:hover { background:var(--primary-l); color:var(--primary); border-color:var(--primary); }
    .form-actions { display:flex; gap:5px; }
    .btn-add { background:var(--primary); color:#fff; border:none; border-radius:7px; padding:5px 14px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600; }
    .btn-add:hover { background:var(--primary-h); }
    .btn-cancel { background:var(--surface); color:var(--text2); border:1px solid var(--border); border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
    .btn-cancel:hover { background:var(--surface2); }

    /* ─── Weather bar ─── */
    .weather-bar {
      border-top:1px solid var(--border2); padding:8px 10px;
      display:flex; align-items:center; justify-content:center; gap:6px;
      background:linear-gradient(to bottom, var(--surface), var(--surface2));
      min-height:46px;
    }
    .weather-emoji { font-size:20px; }
    .weather-info { display:flex; flex-direction:column; align-items:center; gap:1px; }
    .weather-temp { font-size:12px; font-weight:600; }
    .weather-temp .hi { color:var(--red); }
    .weather-temp .lo { color:var(--primary); }
    .weather-desc { font-size:10px; color:var(--text3); }
    .weather-rain { font-size:10px; color:var(--primary); }
    .weather-skeleton { font-size:11px; color:var(--text3); }

    /* ─── Month view ─── */
    .month-wrap { padding:16px; }
    .month-day-headers { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
    .month-day-header { text-align:center; font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.5px; padding:4px 0; text-transform:uppercase; }
    .month-day-header:nth-child(6), .month-day-header:nth-child(7) { color:var(--red); opacity:.7; }
    .month-grid { display:flex; flex-direction:column; gap:2px; }
    .month-week { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .month-cell {
      background:var(--surface); border:1px solid var(--border2); border-radius:12px;
      min-height:100px; padding:8px; cursor:pointer; transition:all .15s;
      display:flex; flex-direction:column; gap:2px; overflow:hidden;
    }
    .month-cell:hover { border-color:var(--primary); box-shadow:var(--shadow-md),0 0 0 2px var(--primary-l); }
    .month-cell.is-today { border-color:var(--primary); border-width:2px; }
    .month-cell.other-month { opacity:.45; }
    .month-cell.is-weekend { background:color-mix(in srgb, var(--surface) 97%, var(--red) 3%); }
    .month-date-num { font-size:13px; font-weight:600; color:var(--text2); margin-bottom:2px; }
    .month-today-circle {
      width:26px; height:26px; border-radius:50%; background:var(--primary);
      display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:#fff; margin-bottom:2px;
    }
    .month-pill {
      font-size:11px; padding:2px 7px; border-radius:6px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; background:var(--primary-l);
      color:var(--primary); font-weight:500; line-height:1.4;
    }
    .month-pill.done { text-decoration:line-through; opacity:.5; }
    .month-pill.colored { color:#fff; }
    .month-more { font-size:10px; color:var(--text3); padding-left:2px; }

    /* ─── Search results ─── */
    .search-results-wrap { padding:16px; }
    .search-result-group { margin-bottom:20px; }
    .search-result-date { font-size:12px; font-weight:700; color:var(--text2); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border2); }
    .search-result-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; background:var(--surface); margin-bottom:4px; cursor:pointer; box-shadow:var(--shadow); }
    .search-result-item:hover { border-left:3px solid var(--primary); }
    .search-result-text { font-size:13px; color:var(--text); }
    .search-empty { text-align:center; padding:60px 20px; color:var(--text3); font-size:14px; }

    /* ─── Edit modal ─── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:500;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(2px); animation:fadeIn .15s;
    }
    .modal-overlay.hidden { display:none; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .modal-box {
      background:var(--surface); border-radius:20px; padding:28px;
      width:340px; box-shadow:var(--shadow-lg); animation:slideUp .2s;
      border:1px solid var(--border);
    }
    .modal-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:14px; }
    .modal-input {
      width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 12px;
      font-size:14px; font-family:inherit; outline:none; background:var(--surface);
      color:var(--text); margin-bottom:12px; transition:border-color .15s, box-shadow .15s;
    }
    .modal-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-l); }
    .modal-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .modal-label { font-size:12px; color:var(--text2); font-weight:600; min-width:36px; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .btn-primary { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn-primary:hover { background:var(--primary-h); }
    .btn-secondary { background:var(--surface2); color:var(--text2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
    .btn-secondary:hover { background:var(--border); }

    /* ─── Shortcuts hint ─── */
    .shortcuts-hint { position:fixed; bottom:16px; right:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:11px; color:var(--text3); box-shadow:var(--shadow-md); line-height:1.8; z-index:100; opacity:.7; transition:opacity .15s; }
    .shortcuts-hint:hover { opacity:1; }
    .shortcut-key { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:monospace; font-size:10px; color:var(--text2); }

    /* ─── Dashboard ─── */
    .dashboard { display:none; padding:0 16px 32px; max-width:1400px; margin:0 auto; gap:16px; grid-template-columns:1fr 1fr; }
    @media(min-width:769px){ .dashboard { display:grid; } }
    .dash-panel { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px 24px; }
    .dash-panel-title { font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.8px; text-transform:uppercase; margin-bottom:14px; }
    .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
    .stat-box { background:var(--surface2); border-radius:10px; padding:12px 10px; text-align:center; }
    .stat-num { font-size:22px; font-weight:800; color:var(--primary); line-height:1; }
    .stat-label { font-size:10px; color:var(--text3); margin-top:4px; }
    .upcoming-list { display:flex; flex-direction:column; gap:6px; }
    .upcoming-item { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface2); border-radius:8px; }
    .upcoming-dday { font-size:11px; font-weight:700; min-width:44px; text-align:center; padding:2px 6px; border-radius:6px; }
    .upcoming-dday.today { background:#ff4d4f22; color:#ff4d4f; }
    .upcoming-dday.soon  { background:#fa8c1622; color:#fa8c16; }
    .upcoming-dday.far   { background:#1677ff22; color:#1677ff; }
    .upcoming-dday.past  { background:var(--border); color:var(--text3); }
    .upcoming-info { flex:1; min-width:0; }
    .upcoming-name { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .upcoming-date { font-size:10px; color:var(--text3); margin-top:1px; }
    .upcoming-tag { font-size:10px; padding:2px 7px; border-radius:20px; background:var(--surface); border:1px solid var(--border); color:var(--text3); white-space:nowrap; }
    .tip-box { background:linear-gradient(135deg,var(--primary-l),var(--surface2)); border-radius:10px; padding:14px; border-left:3px solid var(--primary); }
    .tip-label { font-size:10px; font-weight:700; color:var(--primary); margin-bottom:6px; }
    .tip-text { font-size:12px; color:var(--text); line-height:1.6; }
    .week-bar-wrap { display:flex; gap:6px; align-items:flex-end; height:60px; margin-top:4px; }
    .week-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .week-bar { width:100%; border-radius:4px 4px 0 0; background:var(--primary); opacity:.7; min-height:4px; transition:height .3s; }
    .week-bar.today { opacity:1; }
    .week-bar-day { font-size:9px; color:var(--text3); }

    /* ─── Mobile bottom nav ─── */
    .mobile-nav { display:none; }

    /* ─── Mobile scroll indicator ─── */
    .scroll-hint { display:none; }

    /* ═══════════════════════════════════════
       MOBILE RESPONSIVE  (≤ 768px)
    ═══════════════════════════════════════ */
    @media (max-width: 768px) {

      /* Header: 2-row compact */
      .header {
        height:auto; flex-wrap:wrap; padding:8px 12px; gap:6px;
      }
      .header-title { font-size:15px; order:1; }
      .view-toggle { order:2; flex-wrap:wrap; }
      .nav-group { order:3; flex:1; justify-content:flex-end; gap:4px; }
      .search-wrap { order:5; max-width:100%; flex:1 1 100%; }
      .header-actions { order:4; margin-left:0; gap:6px; }
      .progress-pill { display:none; }
      .week-label { font-size:12px; min-width:unset; }
      .nav-btn { padding:5px 10px; font-size:12px; }
      .today-btn { padding:5px 10px; }

      /* Week view: horizontal snap scroll (swipe between days) */
      .calendar-wrap { padding:10px 8px; overflow-x:scroll; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
      .calendar-wrap::-webkit-scrollbar { display:none; }
      .calendar-grid { display:flex; gap:8px; min-width:unset; width:max-content; padding-bottom:2px; }
      .day-col {
        width:82vw; min-width:82vw; flex-shrink:0; min-height:480px;
        scroll-snap-align:start;
      }

      /* Task items: bigger touch targets */
      .task-item { padding:8px 4px; min-height:36px; }
      .task-cb { width:20px; height:20px; border-radius:5px; flex-shrink:0; }
      .task-cb.checked::after { font-size:11px; }
      .task-text { font-size:13px; }
      .task-star { font-size:16px; }
      .task-item.sub .task-cb { width:16px; height:16px; }
      .task-item.sub .task-text { font-size:12px; }

      /* Always show action buttons on mobile (no hover) */
      .task-actions { opacity:1; }
      .task-act-btn { width:28px; height:28px; font-size:14px; }

      /* Add task button */
      .add-task-btn { padding:10px; font-size:13px; margin:8px; width:calc(100% - 16px); }

      /* Input form */
      .task-input { font-size:14px; padding:8px 12px; }
      .btn-add { padding:8px 16px; font-size:13px; }
      .btn-cancel { padding:8px 12px; font-size:13px; }
      .repeat-opt { padding:6px 0; font-size:12px; }
      .cp-dot { width:22px; height:22px; }

      /* Day header */
      .day-header { padding:12px 12px 10px; }
      .day-name { font-size:11px; }
      .day-num { font-size:22px; }
      .day-num-wrap { width:36px; height:36px; }

      /* Weather bar */
      .weather-bar { padding:10px; min-height:50px; }
      .weather-emoji { font-size:24px; }
      .weather-temp { font-size:13px; }

      /* Month view */
      .month-wrap { padding:8px; }
      .month-cell { min-height:68px; padding:5px; }
      .month-date-num { font-size:12px; }
      .month-today-circle { width:22px; height:22px; font-size:11px; }
      .month-pill { font-size:9px; padding:1px 4px; }
      .month-day-header { font-size:10px; }

      /* Modal: full width */
      .modal-box { width:calc(100vw - 32px); padding:18px 16px; }
      .modal-input { font-size:15px; padding:10px 12px; }

      /* Repeat badge */
      .repeat-badge { font-size:10px; padding:2px 6px; }

      /* Hide shortcuts hint */
      .shortcuts-hint { display:none; }

      /* Scroll hint arrow */
      .scroll-hint {
        display:flex; align-items:center; justify-content:center;
        gap:4px; font-size:11px; color:var(--text3); padding:2px 0 6px;
        animation:bounce .8s ease-in-out infinite alternate;
      }
      @keyframes bounce { from { opacity:.4; } to { opacity:1; } }
    }

    /* Very small screens (≤ 380px) */
    @media (max-width: 380px) {
      .day-col { width:90vw; min-width:90vw; }
      .view-btn { padding:4px 8px; font-size:11px; }
      .nav-btn { padding:5px 8px; }
    }

    /* Tablet (769px ~ 1059px): 3-column layout */
    @media (min-width: 769px) and (max-width: 1059px) {
      .calendar-grid { grid-template-columns:repeat(4,1fr); min-width:unset; }
      .day-col { min-height:380px; }
    }

    /* ─── Landing page ─── */
    .landing-overlay {
      position:fixed; inset:0; background:var(--bg); z-index:1000;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .landing-card {
      background:var(--surface); border:1px solid var(--border); border-radius:20px;
      padding:40px 36px; max-width:420px; width:100%; text-align:center;
      box-shadow:var(--shadow-md);
    }
    .landing-icon { font-size:52px; margin-bottom:12px; }
    .landing-title { font-size:26px; font-weight:800; color:var(--text); margin-bottom:6px; }
    .landing-sub { font-size:14px; color:var(--text2); margin-bottom:28px; }
    .landing-input-wrap { display:flex; gap:8px; margin-bottom:10px; }
    .landing-input {
      flex:1; border:1.5px solid var(--border); border-radius:10px; padding:11px 14px;
      font-size:15px; font-family:inherit; outline:none; background:var(--surface);
      color:var(--text); transition:border-color .15s, box-shadow .15s;
    }
    .landing-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-l); }
    .landing-btn {
      background:var(--primary); color:#fff; border:none; border-radius:10px;
      padding:11px 20px; font-size:15px; font-weight:700; cursor:pointer;
      font-family:inherit; transition:background .15s; white-space:nowrap;
    }
    .landing-btn:hover { background:var(--primary-h); }
    .landing-hint { font-size:12px; color:var(--text3); margin-bottom:24px; }
    .landing-features {
      display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
      margin-bottom:24px;
    }
    .landing-feat {
      background:var(--surface2); border:1px solid var(--border); border-radius:20px;
      padding:5px 12px; font-size:12px; color:var(--text2);
    }
    .landing-demo {
      display:inline-block; font-size:13px; color:var(--primary); text-decoration:none;
      border:1px solid var(--primary-l); border-radius:8px; padding:6px 16px;
      transition:background .15s;
    }
    .landing-demo:hover { background:var(--primary-l); }
    .landing-dark-btn {
      position:absolute; top:16px; right:16px; background:none; border:1px solid var(--border);
      border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:16px;
    }

    /* ─── Holidays ─── */
    .day-col.is-holiday { background:color-mix(in srgb, var(--surface) 88%, var(--red) 12%) !important; }
    .month-cell.is-holiday { background:color-mix(in srgb, var(--surface) 88%, var(--red) 12%) !important; }
    .holiday-label {
      font-size:9px; font-weight:700; color:var(--red); letter-spacing:.3px;
      background:color-mix(in srgb, var(--red) 12%, transparent); border-radius:4px;
      padding:1px 5px; margin-top:4px; display:inline-block;
    }
    .month-holiday-label { font-size:9px; color:var(--red); font-weight:600; line-height:1.3; }
    .repeat-adjusted-badge {
      display:inline-flex; align-items:center; gap:2px; font-size:9px;
      color:var(--orange); background:color-mix(in srgb, var(--orange) 12%, transparent);
      border-radius:4px; padding:1px 5px; margin-top:2px; font-weight:600;
    }

    /* ─── Memo popup ─── */
    .memo-overlay { position:fixed; inset:0; z-index:450; }
    .memo-overlay.hidden { display:none; }
    .memo-popup {
      position:fixed; width:300px; max-width:calc(100vw - 32px);
      background:#fffef5; border:1px solid #e0d888;
      border-radius:14px; overflow:hidden;
      box-shadow:0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
      animation:memoIn .15s ease; z-index:451;
    }
    [data-theme="dark"] .memo-popup { background:#252318; border-color:#4a4630; }
    @keyframes memoIn { from{opacity:0;transform:scale(.94) translateY(6px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .memo-header {
      display:flex; align-items:center; gap:8px;
      padding:11px 14px 10px; border-bottom:1px solid #e8e080;
      background:#fff8cc;
    }
    [data-theme="dark"] .memo-header { background:#2a2810; border-color:#4a4630; }
    .memo-icon { font-size:15px; flex-shrink:0; }
    .memo-task-title { flex:1; font-size:12px; font-weight:600; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    [data-theme="dark"] .memo-task-title { color:#aaa; }
    .memo-close {
      background:none; border:none; cursor:pointer; font-size:13px; color:#bbb;
      padding:3px 5px; border-radius:5px; flex-shrink:0; transition:all .12s;
    }
    .memo-close:hover { background:rgba(244,67,54,.12); color:#f44336; }
    .memo-textarea {
      width:100%; min-height:150px; max-height:320px; resize:vertical;
      border:none; outline:none; padding:13px 14px; font-size:13px;
      font-family:inherit; line-height:1.65; background:transparent; color:#333;
    }
    [data-theme="dark"] .memo-textarea { color:#ddd; }
    .memo-textarea::placeholder { color:#bbb; }
    .memo-footer {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 14px 10px; font-size:11px; color:#bbb;
      border-top:1px dashed #e0d888;
    }
    [data-theme="dark"] .memo-footer { border-color:#4a4630; }
    .memo-status.ok { color:#43a047; }
    .memo-status.saving { color:#f9a825; }

    /* memo markdown view */
    .memo-md {
      min-height:140px; max-height:300px; overflow-y:auto; padding:12px 14px;
      font-size:13px; line-height:1.65; color:#333; cursor:text;
    }
    [data-theme="dark"] .memo-md { color:#ddd; }
    .memo-md.hidden { display:none; }
    .memo-md .md-h { font-weight:700; font-size:14px; margin:4px 0 2px; }
    .memo-md .md-check.done { text-decoration:line-through; opacity:.6; }
    .memo-md code { background:rgba(0,0,0,.08); border-radius:4px; padding:0 4px; font-size:12px; }
    [data-theme="dark"] .memo-md code { background:rgba(255,255,255,.12); }
    .memo-md a { color:var(--primary); word-break:break-all; }

    /* memo history */
    .memo-history { padding:6px 14px 10px; display:flex; flex-direction:column; gap:5px; border-top:1px dashed #e0d888; }
    [data-theme="dark"] .memo-history { border-color:#4a4630; }
    .memo-history.hidden { display:none; }
    .memo-hist-row { display:flex; align-items:center; gap:8px; font-size:11px; }
    .memo-hist-meta { color:var(--text3); flex-shrink:0; font-variant-numeric:tabular-nums; }
    .memo-hist-excerpt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#555; }
    [data-theme="dark"] .memo-hist-excerpt { color:#bbb; }
    .memo-hist-empty { font-size:11px; color:var(--text3); text-align:center; padding:6px; }

    /* memo all modal */
    .memo-all-item {
      padding:9px 12px; border-radius:10px; background:var(--surface2); cursor:pointer;
      transition:background .12s;
    }
    .memo-all-item:hover { background:var(--primary-l); }
    .memo-all-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:3px; }

function prevWorkday(date) {
  let d = new Date(date);

// ── URL User ──
const URL_PARAMS = new URLSearchParams(window.location.search);
const USER_ID = URL_PARAMS.get('u') || '';
const STORAGE_KEY = USER_ID ? `calTasks_${USER_ID}` : 'calTasks';

// ── Landing page ──
if (!USER_ID) {
  // Auto-redirect to last used user if they've been here before
  const lastUser = localStorage.getItem('lastUser');
  if (lastUser) {
    window.location.replace(`?u=${encodeURIComponent(lastUser)}`);
  } else {
    document.getElementById('landingOverlay').style.display = 'flex';
    document.getElementById('landingInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('landingStartBtn').click();
    });
    document.getElementById('landingStartBtn').onclick = () => {
      const name = document.getElementById('landingInput').value.trim();
      if (!name) { document.getElementById('landingInput').focus(); return; }
      localStorage.setItem('lastUser', name);
      window.location.href = `?u=${encodeURIComponent(name)}`;
    };
    document.getElementById('landingDarkBtn').onclick = () => {
      const html = document.documentElement;
      const isDark = html.dataset.theme === 'dark';
      html.dataset.theme = isDark ? 'light' : 'dark';
      document.getElementById('landingDarkBtn').textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', html.dataset.theme);
    };
  }
} else {
  // Remember this user for future visits
  localStorage.setItem('lastUser', USER_ID);
  // Show user chip + copy URL button
  document.getElementById('userChip').style.display = 'flex';
  document.getElementById('userChipName').textContent = decodeURIComponent(USER_ID);
  document.getElementById('copyUrlBtn').style.display = 'flex';
  document.getElementById('copyUrlBtn').onclick = () => {
    const url = window.location.href.split('?')[0] + `?u=${encodeURIComponent(USER_ID)}`;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyUrlBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '✅ <span>복사됨!</span>';
      setTimeout(() => { btn.innerHTML = orig; }, 1800);
    });
  };
  document.getElementById('forceSyncBtn').style.display = 'flex';
  document.getElementById('forceSyncBtn').onclick = () => {
    const btn = document.getElementById('forceSyncBtn');
    btn.innerHTML = '⏳ <span>저장 중...</span>';
    btn.disabled = true;
    fbUpload()
      .then(() => { btn.innerHTML = '✅ <span>저장됨</span>'; })
      .catch(() => { btn.innerHTML = '❌ <span>실패</span>'; })
      .finally(() => setTimeout(() => { btn.innerHTML = '☁️ <span>저장</span>'; btn.disabled = false; }, 2000));
  };
  document.getElementById('switchUserBtn').style.display = 'flex';
  document.getElementById('switchUserBtn').onclick = () => {
    if (confirm('다른 사용자로 전환할까요? 현재 데이터는 유지됩니다.')) {
      localStorage.removeItem('lastUser');
      window.location.href = window.location.href.split('?')[0];
    }
  };
}

// ── Persistence ──
function loadTasks() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (Object.keys(stored).length === 0) {
      return JSON.parse(JSON.stringify(SEED_TASKS));
    }
    return stored;
  } catch { return {}; }
}

let pendingUpload = false;

function saveTasks(dk) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  const ref = fbRef();
  if (!ref) return;
  if (!navigator.onLine) { pendingUpload = true; setSyncStatus('offline'); return; }
  setSyncStatus('syncing');
  clearTimeout(fbSaveTimer);
  fbSaveTimer = setTimeout(() => {
    const saveRef = dk ? ref.child(dk) : ref;
    const saveData = dk ? (tasks[dk] || null) : tasks;
    saveRef.set(saveData)
      .then(() => setSyncStatus('synced'))
      .catch(() => { pendingUpload = true; setSyncStatus('offline'); });
  }, 300);
}

function fbUpload() {
  const ref = fbRef();
  if (!ref) return Promise.reject('no ref');
  setSyncStatus('syncing');
  return ref.set(tasks)
    .then(() => setSyncStatus('synced'))
    .catch(e => { setSyncStatus('offline'); throw e; });
}

function initFirebaseSync() {
  const ref = fbRef();
  if (!ref) return;
  const dot = document.getElementById('syncDot');
  if (dot) dot.style.display = 'block';
  setSyncStatus('syncing');
  // 1) 먼저 한 번 읽어서 Firebase 데이터 유무 확인
  ref.once('value').then(snapshot => {
    const remote = snapshot.val();
    if (remote && typeof remote === 'object' && Object.keys(remote).length > 0) {
      // Firebase에 데이터 있음 → 로컬에 덮어쓰기
      tasks = remote;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
      setSyncStatus('synced');
    } else if (Object.keys(tasks).length > 0) {
      // Firebase 비어있고 로컬에 데이터 있음 → Firebase로 업로드
      fbUpload();
    } else {
      setSyncStatus('synced');
    }
    // 2) 이후 다른 기기 변경사항 실시간 반영
    ref.on('value', snapshot => {
      const remote = snapshot.val();
      if (remote && typeof remote === 'object') {
        tasks = remote;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        render();
      }
    });
  }).catch(() => setSyncStatus('offline'));
}

// ── Date helpers ──
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate()-(day===0?6:day-1));
  date.setHours(0,0,0,0); return date;
}
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function dateToDayIdx(d) { const day=new Date(d).getDay(); return day===0?6:day-1; }

// ── Repeat helpers ──
function getRepeatTasksForDate(date, dayIdx) {
  const dk = dateKey(date);
  const out = [];
  Object.entries(tasks).forEach(([oDk, list]) => {
    if (oDk===dk) return;
    if (!Array.isArray(list)) return;
    list.forEach(t => {
      if (!t||!t.repeat||t.repeat==='none') return;
      const originDate = new Date(oDk);
      const limitDate = new Date(oDk);
      limitDate.setFullYear(limitDate.getFullYear() + 1);
      if (date > limitDate) return; // 생성일로부터 1년 초과 시 반복 종료
      if (t.repeat==='weekly' && dateToDayIdx(oDk)===dayIdx) {
        out.push({task:t, originDk:oDk, instanceDk:dk});
      }
      if (t.repeat==='biweekly' && dateToDayIdx(oDk)===dayIdx) {
        const weeksDiff = Math.round((getMonday(date) - getMonday(originDate)) / (7*86400000));
        if (weeksDiff!==0 && weeksDiff%2===0) out.push({task:t, originDk:oDk, instanceDk:dk});
      }
      if (t.repeat==='monthly') {
        const originDay = originDate.getDate();
        const adj = adjustedMonthlyDate(date.getFullYear(), date.getMonth(), originDay);
        if (adj && dateKey(adj) === dk) out.push({task:t, originDk:oDk, instanceDk:dk, adjusted: adj.getDate()!==originDay});
      }
      if (t.repeat==='monthlyNth') {
        // 매월 N번째 요일 (예: 둘째 화요일) — 원본 날짜의 주차·요일과 일치하는 날
        if (date.getDay()===originDate.getDay() && Math.ceil(date.getDate()/7)===Math.ceil(originDate.getDate()/7)) {
          out.push({task:t, originDk:oDk, instanceDk:dk});
        }
      }
    });
  });
  return out;
}
function isRepeatChecked(task, instanceDk) {
  if (!task.completions) return task.checked;
  return instanceDk in task.completions ? task.completions[instanceDk] : false;
}
function toggleRepeatInst(originDk, taskId, instanceDk) {
  const t=(tasks[originDk]||[]).find(x=>x.id===taskId); if(!t)return;
  if(!t.completions) t.completions={};
  t.completions[instanceDk]=!isRepeatChecked(t,instanceDk);
  saveTasks(originDk); render();
}

// ── Task mutations ──
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function addTask(dk,text,color,starred,repeat,parentId,priority,time) {
  if(!tasks[dk]) tasks[dk]=[];
  const t={id:uid(),text,checked:false,starred:!!starred,color:color||null,repeat:repeat||'none',priority:priority||null,time:time||null,completions:{},subs:[]};
  if(parentId){const p=tasks[dk].find(x=>x.id===parentId);if(p){if(!Array.isArray(p.subs))p.subs=[];p.subs.push(t);}}
  else tasks[dk].push(t);
  saveTasks(dk); activeInput=null; render();
}

// ── Task sort: 중요 → 마감시간순 → 시간 없는 항목 ──
function taskSort(a,b){
  const s=(b.starred?1:0)-(a.starred?1:0); if(s)return s;
  if(a.time&&b.time)return a.time<b.time?-1:a.time>b.time?1:0;
  if(a.time)return -1;
  if(b.time)return 1;
  return 0;
}

// ── Reorder within same day (드래그 순서 변경) ──
function reorderTask(dk,dragId,targetId){
  const list=tasks[dk]; if(!list)return;
  const from=list.findIndex(t=>t.id===dragId);
  if(from<0)return;
  const [moved]=list.splice(from,1);
  const to=list.findIndex(t=>t.id===targetId);
  if(to<0){list.splice(from,0,moved);return;}
  list.splice(to,0,moved);
  saveTasks(dk);render();
}

// ── Quick input date parsing (e.g. "내일 회의", "다음주 화요일 보고", "3/15 발표") ──
function parseQuickDate(text){
  const now=today();
  const dayMap={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
  let m;
  if((m=text.match(/(오늘|내일|모레|글피)\s*/))){
    const offsets={'오늘':0,'내일':1,'모레':2,'글피':3};
    const d=new Date(now); d.setDate(d.getDate()+offsets[m[1]]);
    return {date:d, text:(text.slice(0,m.index)+text.slice(m.index+m[0].length)).trim()};
  }
  if((m=text.match(/(다음\s?주|이번\s?주)\s*([월화수목금토일])요?일?\s*/))){
    const targetDay=dayMap[m[2]];
    const base=getMonday(now);
    const add=m[1].replace(/\s/g,'')==='다음주'?7:0;
    const d=new Date(base); d.setDate(d.getDate()+add+((targetDay+6)%7));
    return {date:d, text:(text.slice(0,m.index)+text.slice(m.index+m[0].length)).trim()};
  }
  if((m=text.match(/(\d{1,2})[\/월]\s?(\d{1,2})일?\s*/))){
    const mo=+m[1], da=+m[2];
    if(mo>=1&&mo<=12&&da>=1&&da<=31){
      let d=new Date(now.getFullYear(),mo-1,da);
      if(d<now) d.setFullYear(d.getFullYear()+1);
      return {date:d, text:(text.slice(0,m.index)+text.slice(m.index+m[0].length)).trim()};
    }
  }
  return null;
}
function toggleTask(dk,id,subId) {
  const list=tasks[dk]||[];
  if(subId){const p=list.find(x=>x.id===id);if(p){const s=p.subs.find(x=>x.id===subId);if(s)s.checked=!s.checked;}}
  else{
    const t=list.find(x=>x.id===id);
    if(t){t.checked=!t.checked; if(t.checked)t.completedAt=Date.now(); else delete t.completedAt;}
  }
  saveTasks(dk); render();
}
function toggleStar(dk,id){const t=(tasks[dk]||[]).find(x=>x.id===id);if(t){t.starred=!t.starred;saveTasks(dk);render();}}
function deleteTask(dk,id,subId) {
  if(!tasks[dk])return;
  if(subId){
    const p=tasks[dk].find(x=>x.id===id);
    if(p&&Array.isArray(p.subs)){
      const idx=p.subs.findIndex(x=>x.id===subId);
      if(idx>=0) addToTrash(dk,p.subs.splice(idx,1)[0],id);
    }
  } else {
    const idx=tasks[dk].findIndex(x=>x.id===id);
    if(idx>=0) addToTrash(dk,tasks[dk].splice(idx,1)[0],null);
  }
  saveTasks(dk); render();
}

// ── Trash (휴지통, 30일 보관) ──
const TRASH_KEY = USER_ID ? `calTrash_${USER_ID}` : 'calTrash';
function loadTrash(){ try{ return JSON.parse(localStorage.getItem(TRASH_KEY)||'[]'); }catch{ return []; } }
function saveTrash(trash){ localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); }
function purgeOldTrash(){
  const cutoff=Date.now()-30*86400000;
  const trash=loadTrash();
  const kept=trash.filter(x=>x.deletedAt>cutoff);
  if(kept.length!==trash.length) saveTrash(kept);
}
function addToTrash(dk,task,parentId){
  const trash=loadTrash();
  trash.unshift({id:uid(),dk,task,parentId,deletedAt:Date.now()});
  saveTrash(trash);
}
function restoreFromTrash(trashId){
  const trash=loadTrash();
  const idx=trash.findIndex(x=>x.id===trashId);
  if(idx<0)return;
  const item=trash[idx];
  if(!tasks[item.dk]) tasks[item.dk]=[];
  if(item.parentId){
    const p=tasks[item.dk].find(x=>x.id===item.parentId);
    if(p){ if(!Array.isArray(p.subs))p.subs=[]; p.subs.push(item.task); }
    else tasks[item.dk].push(item.task);
  } else {
    tasks[item.dk].push(item.task);
  }
  trash.splice(idx,1); saveTrash(trash);
  saveTasks(item.dk); render(); renderTrashModal();
}
function permanentDeleteTrash(trashId){
  const trash=loadTrash();
  saveTrash(trash.filter(x=>x.id!==trashId));
  renderTrashModal();
}
function renderTrashModal(){
  const list=document.getElementById('trashList');
  list.innerHTML='';
  const trash=loadTrash();
  if(!trash.length){ list.appendChild(el('div','trash-empty',{textContent:'휴지통이 비어있습니다'})); return; }
  trash.forEach(item=>{
    const row=el('div','trash-item');
    const info=el('div','trash-info');
    info.appendChild(el('div',`trash-text${item.task.checked?' done':''}`,{textContent:(item.task.starred?'★ ':'')+item.task.text}));
    const d=new Date(item.dk);
    const daysLeft=30-Math.floor((Date.now()-item.deletedAt)/86400000);
    info.appendChild(el('div','trash-meta',{textContent:`${d.getMonth()+1}/${d.getDate()} 삭제됨 · ${daysLeft}일 후 영구삭제`}));
    row.appendChild(info);
    const actions=el('div','trash-actions');
    const restoreBtn=el('button','trash-act-btn',{textContent:'↩ 복구'});
    restoreBtn.onclick=()=>restoreFromTrash(item.id);
    const delBtn=el('button','trash-act-btn del',{textContent:'✕'});
    delBtn.onclick=()=>{ if(confirm('영구 삭제할까요?')) permanentDeleteTrash(item.id); };
    actions.appendChild(restoreBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    list.appendChild(row);
  });
}

function positionMemo(anchor) {
  const pop = document.getElementById('memoPopup');

  const rect = anchor.getBoundingClientRect();
  const popW = 300, popH = 260;
  let left = rect.right + 14;
  let top  = rect.top + window.scrollY - 8;
  if (left + popW > window.innerWidth - 12) left = rect.left - popW - 14;
  if (left < 12) left = 12;
  if (top + popH > window.scrollY + window.innerHeight - 12) top = window.scrollY + window.innerHeight - popH - 12;
  if (top < window.scrollY + 8) top = window.scrollY + 8;
  pop.style.left = left + 'px';

function saveMemoNow() {
  if (!memoCtx) return;
  const task = (tasks[memoCtx.dk]||[]).find(t=>t.id===memoCtx.taskId);
  if (task) {
    const v = document.getElementById('memoTextarea').value;
    if (v !== (task.memo||'')) {
      // 버전 히스토리: 직전 내용 보관 (5분 간격, 최대 5개)
      const old = task.memo||'';
      if (old.trim()) {
        if (!Array.isArray(task.memoHistory)) task.memoHistory = [];
        const last = task.memoHistory[task.memoHistory.length-1];
        if (!last || Date.now()-last.ts > 5*60*1000) {
          task.memoHistory.push({ts: task.memoUpdated||Date.now(), text: old});
          if (task.memoHistory.length > 5) task.memoHistory.shift();
        }
      }
      task.memoUpdated = Date.now();
    }
    task.memo = v;
    saveTasks(memoCtx.dk);
    render();
  }
}

// ── 메모 마크다운 라이트 보기 ──
let memoViewMode='edit';
function renderMemoMD(text){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(text)
    .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .split('\n').map(l=>{
      if(/^- \[x\] /i.test(l))return '<div class="md-line md-check done">☑ '+l.slice(6)+'</div>';
      if(/^- \[ \] /.test(l))return '<div class="md-line md-check">☐ '+l.slice(6)+'</div>';
      if(/^- /.test(l))return '<div class="md-line">• '+l.slice(2)+'</div>';
      if(/^# /.test(l))return '<div class="md-line md-h">'+l.slice(2)+'</div>';
      return '<div class="md-line">'+(l||'&nbsp;')+'</div>';
    }).join('');
}

// ── 메모 이미지 (IndexedDB 로컬 저장 — 기기 간 동기화되지 않음) ──
let imgDB=null;
function openImgDB(){
  return new Promise((res,rej)=>{
    if(imgDB)return res(imgDB);
    const r=indexedDB.open('plannerImages',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('images');
    r.onsuccess=()=>{imgDB=r.result;res(imgDB);};
    r.onerror=()=>rej(r.error);
  });
}
function idbPutImage(id,blob){
  return openImgDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('images','readwrite');
    tx.objectStore('images').put(blob,id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function idbGetImage(id){
  return openImgDB().then(db=>new Promise((res,rej)=>{
    const rq=db.transaction('images','readonly').objectStore('images').get(id);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }));
}
function idbDeleteImage(id){
  return openImgDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('images','readwrite');
    tx.objectStore('images').delete(id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function memoTask(){
  if(!memoCtx)return null;
  return (tasks[memoCtx.dk]||[]).find(t=>t.id===memoCtx.taskId)||null;
}
function attachMemoImage(file){
  if(!file||!file.type.startsWith('image/'))return;
  if(file.size>8*1024*1024){alert('이미지가 너무 큽니다 (최대 8MB)');return;}
  const task=memoTask(); if(!task)return;
  const id='img_'+uid();
  idbPutImage(id,file).then(()=>{
    if(!Array.isArray(task.memoImages))task.memoImages=[];
    task.memoImages.push(id);
    saveTasks(memoCtx.dk);
    renderMemoImages(task);
    render();
  }).catch(()=>alert('이미지 저장 실패'));
}
function renderMemoImages(task){
  const wrap=document.getElementById('memoImages');
  wrap.innerHTML='';
  const ids=Array.isArray(task&&task.memoImages)?task.memoImages:[];
  wrap.style.display=ids.length?'flex':'none';
  ids.forEach(id=>{
    const thumb=el('div','memo-img-thumb');
    const delBtn=el('button','memo-img-del',{textContent:'✕',title:'이미지 삭제'});
    delBtn.onclick=e=>{
      e.stopPropagation();
      const t=memoTask(); if(!t)return;
      t.memoImages=(t.memoImages||[]).filter(x=>x!==id);
      idbDeleteImage(id);
      saveTasks(memoCtx.dk);
      renderMemoImages(t);
      render();
    };
    thumb.appendChild(delBtn);
    idbGetImage(id).then(blob=>{
      if(blob){
        const url=URL.createObjectURL(blob);
        const img=el('img',null,{src:url});
        thumb.insertBefore(img,delBtn);
        thumb.onclick=()=>{
          document.getElementById('imgLightboxImg').src=url;
          document.getElementById('imgLightbox').classList.remove('hidden');
        };
      } else {
        thumb.classList.add('missing');
        thumb.insertBefore(el('span',null,{textContent:'📵',title:'이 기기에 없는 이미지'}),delBtn);
      }
    }).catch(()=>{});
    wrap.appendChild(thumb);
  });
}

async function fetchWeather(lat,lon) {
  try {
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&timezone=auto&forecast_days=16`);
    const d=await r.json();
    (d.daily.time||[]).forEach((dt,i)=>{
      const code=d.daily.weathercode[i]??0;
      weatherByDate[dt]={emoji:WMO[code]||'🌡️',desc:WMO_D[code]||'',max:Math.round(d.daily.temperature_2m_max[i]),min:Math.round(d.daily.temperature_2m_min[i]),rain:d.daily.precipitation_probability_max[i]??0};
    });
    render();
  } catch(e){console.warn('날씨 로드 실패',e);}
}

};

// ── DOM helper ──
function el(tag,cls,attrs){const e=document.createElement(tag);if(cls)e.className=cls;if(attrs)Object.assign(e,attrs);return e;}

// ── Task item builder ──
function buildTaskItem(dk,task,isSub,parentId,isRepeatInst,originDk,instanceDk,adjusted) {
  const item=el('div',`task-item${isSub?' sub':''}`);
  const checked=isRepeatInst?isRepeatChecked(task,instanceDk):task.checked;
  if(!isSub){
    item.draggable=true;
    item.ondragstart=e=>{
      e.dataTransfer.setData('application/json',JSON.stringify({dk:isRepeatInst?originDk:dk,id:task.id,isRepeat:!!isRepeatInst}));
      e.dataTransfer.effectAllowed='move';
      item.classList.add('dragging');
    };
    item.ondragend=()=>item.classList.remove('dragging');
    if(!isRepeatInst){
      item.ondragover=e=>{e.preventDefault();e.stopPropagation();item.classList.add('drag-target');};
      item.ondragleave=()=>item.classList.remove('drag-target');
      item.ondrop=e=>{
        e.preventDefault();e.stopPropagation();
        item.classList.remove('drag-target');
        try{
          const data=JSON.parse(e.dataTransfer.getData('application/json'));
          if(!data||!data.id||data.id===task.id)return;
          if(data.dk===dk&&!data.isRepeat){reorderTask(dk,data.id,task.id);}
          else{
            if(data.isRepeat&&!confirm('반복 일정 전체의 시작일을 변경합니다. 계속할까요?'))return;
            moveTask(data.dk,data.id,dk);
          }
        }catch(err){}
      };
    }
  }
  if(!isSub){
    const star=el('span',`task-star${task.starred?' on':''}`,{textContent:'★',title:'중요 표시'});
    star.onclick=e=>{e.stopPropagation();toggleStar(isRepeatInst?originDk:dk,task.id);};
    item.appendChild(star);
  }
  if(task.color){const dot=el('div','color-dot');dot.style.background=task.color;item.appendChild(dot);}
  const cb=el('div',`task-cb${checked?' checked':''}`);
  cb.onclick=e=>{e.stopPropagation();if(isRepeatInst)toggleRepeatInst(originDk,task.id,instanceDk);else toggleTask(dk,parentId||task.id,parentId?task.id:null);};
  item.appendChild(cb);
  const body=el('div','task-body');
  // text + memo dot (clickable to open memo)
  const textWrap=el('div','task-text-wrap');
  if(!isSub&&task.priority){
    const flagMap={high:'🔴',mid:'🟡',low:'🟢'};
    textWrap.appendChild(el('span','priority-flag',{textContent:flagMap[task.priority]||''}));
  }
  if(!isSub&&task.time){
    const now=new Date();
    const nowHM=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const todayDk=dateKey(today());
    const isOverdue=!checked&&(dk<todayDk||(dk===todayDk&&task.time<=nowHM));
    textWrap.appendChild(el('span',`time-badge${isOverdue?' overdue':''}`,{textContent:'⏰'+task.time}));
  }
  const txt=el('div',`task-text${checked?' done':''}`,{textContent:task.text});
  textWrap.appendChild(txt);
  if(!isSub&&task.memo){ const dot=el('span','memo-dot',{title:'메모 있음'}); textWrap.appendChild(dot); }
  if(!isSub){
    textWrap.onclick=e=>{e.stopPropagation();openMemo(isRepeatInst?originDk:dk,task.id,textWrap);};
  }
  body.appendChild(textWrap);
  if(!isSub){
    const tags=task.text.match(/#[\w가-힣]+/g);
    if(tags&&tags.length){
      const tagWrap=el('div','tag-chips');
      tags.forEach(tag=>{
        const chip=el('span','tag-chip',{textContent:tag});
        chip.onclick=e=>{e.stopPropagation();searchQuery=tag;document.getElementById('searchInput').value=tag;render();};
        tagWrap.appendChild(chip);
      });
      body.appendChild(tagWrap);
    }
  }
  if(!isSub&&((task.memo&&task.memo.trim())||(Array.isArray(task.memoImages)&&task.memoImages.length))){
    const firstLine=(task.memo||'').trim().split('\n')[0];
    const imgCnt=Array.isArray(task.memoImages)?task.memoImages.length:0;
    const prev=el('div','memo-preview',{textContent:'📝 '+(imgCnt?`📷${imgCnt} `:'')+firstLine,title:'메모 열기'});
    prev.onclick=e=>{e.stopPropagation();openMemo(isRepeatInst?originDk:dk,task.id,prev);};
    body.appendChild(prev);
  }
  if(!isSub&&task.repeat&&task.repeat!=='none'){
    const repeatLabels={weekly:'🔄 매주',biweekly:'🔄 격주',monthly:'🔄 매월'};
    let repLabel=repeatLabels[task.repeat]||'🔄';
    if(task.repeat==='monthlyNth'){
      const od=new Date(originDk||dk);
      repLabel=`🔄 매월 ${Math.ceil(od.getDate()/7)}째 ${'일월화수목금토'[od.getDay()]}요일`;
    }
    body.appendChild(el('div','repeat-badge',{textContent:repLabel}));
  }
  if(!isSub&&adjusted){
    body.appendChild(el('div','repeat-adjusted-badge',{textContent:'📅 일정 앞당김'}));
  }
  if(!isSub&&Array.isArray(task.subs)&&task.subs.length){
    const subDone=task.subs.filter(s=>s&&s.checked).length;
    body.appendChild(el('div','checklist-badge',{textContent:`✓ ${subDone}/${task.subs.length}`}));
    const sl=el('div','subtask-list');
    task.subs.forEach(s=>sl.appendChild(buildTaskItem(isRepeatInst?originDk:dk,s,true,task.id,false,null,null)));
    body.appendChild(sl);
  }
  if(!isSub){
    const addSub=el('button','add-sub-btn',{textContent:'+ 하위 항목'});
    addSub.onclick=e=>{e.stopPropagation();activeInput={dateKey:dk,dataKey:isRepeatInst?originDk:dk,parentId:task.id};render();};
    body.appendChild(addSub);
  }
  item.appendChild(body);
  const actions=el('div','task-actions');
  if(!isSub){
    const pomoBtn=el('button','task-act-btn',{textContent:'🍅',title:'25분 포모도로 시작'});
    pomoBtn.onclick=e=>{e.stopPropagation();startPomodoroForTask(task.text);};
    actions.appendChild(pomoBtn);
    const editBtn=el('button','task-act-btn',{textContent:'✏️',title:'수정'});
    editBtn.onclick=e=>{e.stopPropagation();openEdit(dk,task,isRepeatInst,originDk);};
    actions.appendChild(editBtn);
    const moveBtn=el('button','task-act-btn move',{textContent:'📅',title:isRepeatInst?'반복 일정 시작일 변경':'다른 날짜로 이동'});
    moveBtn.onclick=e=>{
      e.stopPropagation();
      if(isRepeatInst&&!confirm('반복 일정 전체의 시작일을 변경합니다. 계속할까요?'))return;
      openMovePopup(actions,isRepeatInst?originDk:dk,task.id);
    };
    actions.appendChild(moveBtn);
  }
  const delBtn=el('button','task-act-btn del',{textContent:'✕',title:'삭제'});
  delBtn.onclick=e=>{
    e.stopPropagation();
    const msg=(isRepeatInst||(task.repeat&&task.repeat!=='none'))?'반복 태스크를 전체 삭제할까요?':'삭제할까요?';
    if(confirm(msg)) {
      const tDk=isRepeatInst?originDk:dk;
      if(isSub) deleteTask(tDk,parentId,task.id);
      else deleteTask(tDk,task.id,null);
    }
  };
  actions.appendChild(delBtn);
  item.appendChild(actions);
  return item;
}

// ── Input form builder ──
function buildInputForm(dk,parentId){
  let selColor=null,starred=false,selRepeat='none',selPriority=null;
  let timeInp=null;
  const form=el('div','input-form');
  const row=el('div','input-row');
  const inp=el('input','task-input');
  inp.type='text';inp.placeholder=parentId?'할 일 입력...':'할 일 입력... (예: 내일 회의, 3/15 보고)';inp.id=`inp-${dk}-${parentId||'main'}`;
  row.appendChild(inp);
  if(!parentId){
    const sb=el('button','star-toggle',{type:'button',textContent:'★'});
    sb.onclick=()=>{starred=!starred;sb.classList.toggle('on',starred);};
    row.appendChild(sb);
  }
  form.appendChild(row);
  if(!parentId){
    const cp=el('div','color-picker');
    const none=el('div','cp-dot selected');none.style.background='#e8eaed';none.title='없음';
    none.onclick=()=>{selColor=null;cp.querySelectorAll('.cp-dot').forEach(d=>d.classList.remove('selected'));none.classList.add('selected');};
    cp.appendChild(none);
    COLORS.forEach(c=>{
      const dot=el('div','cp-dot');dot.style.background=c.hex;dot.title=c.name;
      dot.onclick=()=>{selColor=c.hex;cp.querySelectorAll('.cp-dot').forEach(d=>d.classList.remove('selected'));dot.classList.add('selected');};
      cp.appendChild(dot);
    });
    form.appendChild(cp);
    const ps=el('div','priority-selector');
    [['high','🔴'],['mid','🟡'],['low','🟢']].forEach(([val,icon])=>{
      const btn=el('button','priority-opt',{type:'button',textContent:icon,title:val});
      btn.onclick=()=>{
        selPriority=selPriority===val?null:val;
        ps.querySelectorAll('.priority-opt').forEach(b=>b.classList.remove('active'));
        if(selPriority)btn.classList.add('active');
      };
      ps.appendChild(btn);
    });
    form.appendChild(ps);
    const rs=el('div','repeat-selector');
    [['none','없음'],['weekly','매주'],['biweekly','격주'],['monthly','매월'],['monthlyNth','N째 요일']].forEach(([val,label])=>{
      const btn=el('button',`repeat-opt${val==='none'?' active':''}`,{type:'button',textContent:label});
      btn.onclick=()=>{selRepeat=val;rs.querySelectorAll('.repeat-opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');};
      rs.appendChild(btn);
    });
    form.appendChild(rs);
    const timeRow=el('div','time-row');
    timeRow.appendChild(el('span','time-row-label',{textContent:'⏰ 마감시간'}));
    timeInp=el('input','time-input');timeInp.type='time';
    timeRow.appendChild(timeInp);
    form.appendChild(timeRow);
  }
  const acts=el('div','form-actions');
  const addBtn=el('button','btn-add',{type:'button',textContent:'추가'});
  const cancelBtn=el('button','btn-cancel',{type:'button',textContent:'취소'});
  addBtn.onclick=()=>{
    let v=inp.value.trim();
    if(!v){activeInput=null;render();return;}
    let targetDk=dk;
    if(!parentId){
      const parsed=parseQuickDate(v);
      if(parsed&&parsed.text){ v=parsed.text; targetDk=dateKey(parsed.date); }
    }
    addTask(targetDk,v,selColor,starred,selRepeat,parentId,selPriority,timeInp&&timeInp.value?timeInp.value:null);
  };
  cancelBtn.onclick=()=>{activeInput=null;render();};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();if(e.key==='Escape')cancelBtn.click();});
  acts.appendChild(addBtn);acts.appendChild(cancelBtn);form.appendChild(acts);
  return form;
}
