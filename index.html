<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-title { font-size: 18px; font-weight: 700; color: #1a73e8; white-space: nowrap; }
    .week-nav { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      background: #fff; border: 1px solid #dadce0; border-radius: 6px;
      padding: 6px 14px; font-size: 13px; cursor: pointer; color: #444;
      transition: background 0.15s; font-family: inherit;
    }
    .nav-btn:hover { background: #f5f5f5; }
    .today-btn { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .today-btn:hover { background: #1557b0; }
    .week-label { font-size: 14px; font-weight: 600; min-width: 180px; text-align: center; color: #444; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .progress-info { font-size: 12px; color: #888; white-space: nowrap; }
    .progress-bar-wrap {
      width: 80px; height: 6px; background: #e8eaed; border-radius: 3px;
      overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px;
    }
    .progress-bar-fill { height: 100%; background: #43a047; border-radius: 3px; transition: width 0.3s; }
    .location-btn {
      background: none; border: 1px solid #dadce0; border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer; color: #666;
      display: flex; align-items: center; gap: 4px; font-family: inherit;
    }
    .location-btn:hover { background: #f5f5f5; }

    /* ── Calendar grid ── */
    .calendar-wrap { padding: 16px; overflow-x: auto; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(140px, 1fr));
      gap: 8px;
      min-width: 1000px;
    }
    .day-col {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 540px;
      overflow: hidden;
    }
    .day-col.is-today { border: 2px solid #1a73e8; }
    .day-col.is-weekend { background: #fafafa; }

    /* ── Day header ── */
    .day-header { padding: 10px 10px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
    .day-name { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .is-weekend .day-name { color: #e05252; }
    .day-num-wrap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
    }
    .is-today .day-num-wrap { background: #1a73e8; }
    .day-num { font-size: 20px; font-weight: 700; line-height: 1; color: #333; }
    .is-today .day-num { color: #fff; }
    .is-weekend:not(.is-today) .day-num { color: #e05252; }
    .day-month { font-size: 10px; color: #bbb; margin-top: 2px; }

    /* ── Tasks list ── */
    .tasks-list { flex: 1; padding: 6px 6px 0; overflow-y: auto; }
    .task-item {
      display: flex; align-items: flex-start; gap: 5px;
      padding: 4px 3px; border-radius: 5px; position: relative;
    }
    .task-item:hover { background: #f8f9fa; }
    .task-item:hover .task-del { opacity: 1; }
    .task-star {
      font-size: 13px; cursor: pointer; color: #ddd; flex-shrink: 0;
      margin-top: 1px; transition: color 0.15s; user-select: none;
    }
    .task-star.on { color: #f9a825; }
    .task-star:hover { color: #f9a825; }
    .color-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .task-cb {
      width: 14px; height: 14px; border: 1.5px solid #bbb; border-radius: 3px;
      flex-shrink: 0; margin-top: 2px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: #fff; transition: background 0.15s, border-color 0.15s;
    }
    .task-cb.checked { background: #43a047; border-color: #43a047; }
    .task-cb.checked::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 700; }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 12px; line-height: 1.45; word-break: break-word; }
    .task-text.done { text-decoration: line-through; color: #bbb; }
    .task-del {
      font-size: 11px; color: #f44336; cursor: pointer; opacity: 0;
      flex-shrink: 0; padding: 0 2px; transition: opacity 0.15s; user-select: none;
    }

    /* Repeat badge */
    .repeat-badge {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 9px; color: #1a73e8; background: #e8f0fe;
      border-radius: 3px; padding: 1px 4px; margin-top: 2px;
      font-weight: 600;
    }

    /* sub-tasks */
    .subtask-list { margin-top: 2px; }
    .task-item.sub { margin-left: 18px; }
    .task-item.sub .task-cb { width: 12px; height: 12px; }
    .task-item.sub .task-text { font-size: 11px; color: #555; }
    .add-sub-btn {
      display: none; align-items: center; gap: 3px; font-size: 10px;
      color: #aaa; cursor: pointer; margin: 2px 0 0 18px;
      background: none; border: none; padding: 1px 4px; font-family: inherit;
    }
    .task-item:hover .add-sub-btn { display: flex; }
    .add-sub-btn:hover { color: #1a73e8; }

    /* ── Add task button ── */
    .add-task-btn {
      display: flex; align-items: center; gap: 4px;
      width: calc(100% - 12px); margin: 6px;
      padding: 5px 8px; border: 1.5px dashed #ddd; border-radius: 6px;
      background: none; font-size: 12px; color: #bbb; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .add-task-btn:hover { border-color: #1a73e8; color: #1a73e8; background: #f0f6ff; }

    /* ── Input form ── */
    .input-form { padding: 6px 8px 8px; border-top: 1px solid #f0f0f0; }
    .input-row { display: flex; gap: 4px; margin-bottom: 5px; }
    .task-input {
      flex: 1; border: 1px solid #dadce0; border-radius: 5px;
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none;
    }
    .task-input:focus { border-color: #1a73e8; }
    .star-toggle {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: #ddd; line-height: 1; transition: color 0.15s; padding: 0 2px;
    }
    .star-toggle.on { color: #f9a825; }
    .color-picker { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
    .cp-dot {
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s, transform 0.1s;
    }
    .cp-dot:hover { transform: scale(1.15); }
    .cp-dot.selected { border-color: #333; }

    /* Repeat selector */
    .repeat-selector { display: flex; gap: 4px; margin-bottom: 5px; }
    .repeat-opt {
      flex: 1; padding: 3px 0; font-size: 11px; border: 1px solid #dadce0;
      border-radius: 4px; cursor: pointer; text-align: center; color: #666;
      background: #fff; transition: all 0.15s; font-family: inherit;
    }
    .repeat-opt.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

    .form-actions { display: flex; gap: 5px; }
    .btn-add {
      background: #1a73e8; color: #fff; border: none; border-radius: 5px;
      padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .btn-add:hover { background: #1557b0; }
    .btn-cancel {
      background: #fff; color: #666; border: 1px solid #dadce0; border-radius: 5px;
      padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .btn-cancel:hover { background: #f5f5f5; }

    /* ── Weather bar ── */
    .weather-bar {
      border-top: 1px solid #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(to bottom, #fff, #f8faff);
      min-height: 46px;
    }
    .weather-emoji { font-size: 20px; line-height: 1; }
    .weather-info { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .weather-temp { font-size: 12px; font-weight: 600; color: #333; }
    .weather-temp .temp-max { color: #e53935; }
    .weather-temp .temp-min { color: #1a73e8; }
    .weather-desc { font-size: 10px; color: #888; }
    .weather-loading { font-size: 11px; color: #bbb; }
    .weather-rain { font-size: 10px; color: #1a73e8; }
  </style>

// ── Persistence ──
function loadTasks() {
  try {
    const stored = JSON.parse(localStorage.getItem('calTasks') || '{}');
    const merged = JSON.parse(JSON.stringify(SEED_TASKS));
    Object.keys(stored).forEach(dk => { merged[dk] = stored[dk]; });
    return merged;
  } catch { return JSON.parse(JSON.stringify(SEED_TASKS)); }
}
function saveTasks() { localStorage.setItem('calTasks', JSON.stringify(tasks)); }

// ── Date helpers ──
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
  date.setHours(0, 0, 0, 0);
  return date;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }

// ── Repeat helpers ──
// dayIdx: 0=Mon … 6=Sun (same as our column index)
function dateToDayIdx(d) {
  const day = new Date(d).getDay(); // 0=Sun
  return day === 0 ? 6 : day - 1;
}
function getRepeatTasksForDate(date, dayIdx) {
  const dk = dateKey(date);
  const results = [];
  Object.entries(tasks).forEach(([originDk, list]) => {
    if (originDk === dk) return; // shown as normal task
    list.forEach(task => {
      if (!task.repeat || task.repeat === 'none') return;
      if (task.repeat === 'weekly') {
        if (dateToDayIdx(originDk) === dayIdx) results.push({ task, originDk, instanceDk: dk });
      } else if (task.repeat === 'monthly') {
        const originDay = new Date(originDk).getDate();
        if (originDay === date.getDate()) results.push({ task, originDk, instanceDk: dk });
      }
    });
  });
  return results;
}
function isRepeatChecked(task, instanceDk) {
  if (!task.completions) return task.checked;
  return instanceDk in task.completions ? task.completions[instanceDk] : false;
}
function toggleRepeatInstance(originDk, taskId, instanceDk) {
  const task = (tasks[originDk] || []).find(t => t.id === taskId);
  if (!task) return;
  if (!task.completions) task.completions = {};
  task.completions[instanceDk] = !isRepeatChecked(task, instanceDk);
  saveTasks(); render();
}

// ── Task mutations ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function addTask(dk, text, color, starred, repeat, parentId) {
  if (!tasks[dk]) tasks[dk] = [];
  const t = { id: uid(), text, checked: false, starred: !!starred, color: color||null, repeat: repeat||'none', completions:{}, subs:[] };
  if (parentId) {
    const p = tasks[dk].find(x => x.id === parentId);
    if (p) p.subs.push(t);
  } else {
    tasks[dk].push(t);
  }
  saveTasks(); activeInput = null; render();
}
function toggleTask(dk, id, subId) {
  const list = tasks[dk] || [];
  if (subId) {
    const p = list.find(x => x.id === id);
    if (p) { const s = p.subs.find(x => x.id === subId); if (s) s.checked = !s.checked; }
  } else {
    const t = list.find(x => x.id === id);
    if (t) t.checked = !t.checked;
  }
  saveTasks(); render();
}
function toggleStar(dk, id) {
  const t = (tasks[dk]||[]).find(x => x.id === id);
  if (t) { t.starred = !t.starred; saveTasks(); render(); }
}
function deleteTask(dk, id, subId) {
  if (!tasks[dk]) return;
  if (subId) {
    const p = tasks[dk].find(x => x.id === id);
    if (p) p.subs = p.subs.filter(x => x.id !== subId);
  } else {
    tasks[dk] = tasks[dk].filter(x => x.id !== id);
  }
  saveTasks(); render();
}
function deleteRepeatTask(originDk, taskId) {
  if (!tasks[originDk]) return;
  tasks[originDk] = tasks[originDk].filter(x => x.id !== taskId);
  saveTasks(); render();
}

// ── Weather ──
async function fetchWeather(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max` +
      `&timezone=auto&forecast_days=16`;
    const res = await fetch(url);
    const data = await res.json();
    const out = {};
    (data.daily.time || []).forEach((dt, i) => {
      const code = data.daily.weathercode[i] ?? 0;
      out[dt] = {
        emoji: WMO[code] || '🌡️',
        desc:  WMO_DESC[code] || '',
        max:   Math.round(data.daily.temperature_2m_max[i]),
        min:   Math.round(data.daily.temperature_2m_min[i]),
        rain:  data.daily.precipitation_probability_max[i] ?? 0,
      };
    });
    weatherByDate = out;
    render();
  } catch(e) { console.warn('날씨 로드 실패', e); }
}
function requestLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    weatherLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: '내 위치' };
    document.getElementById('locationBtn').textContent = '📍 내 위치';
    fetchWeather(weatherLocation.lat, weatherLocation.lon);
  }, () => {
    fetchWeather(weatherLocation.lat, weatherLocation.lon);
  });
}

// ── DOM helpers ──
function el(tag, cls, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) Object.assign(e, attrs);
  return e;
}

// ── Build task item ──
function buildTaskItem(dk, task, isSub, parentId, isRepeatInst, originDk, instanceDk) {
  const item = el('div', `task-item${isSub ? ' sub' : ''}`);
  const checked = isRepeatInst ? isRepeatChecked(task, instanceDk) : task.checked;

  if (!isSub) {
    const star = el('span', `task-star${task.starred ? ' on' : ''}`, { textContent:'★', title:'중요 표시' });
    star.onclick = e => { e.stopPropagation(); toggleStar(isRepeatInst ? originDk : dk, task.id); };
    item.appendChild(star);
  }
  if (task.color) {
    const dot = el('div', 'color-dot'); dot.style.background = task.color; item.appendChild(dot);
  }

  const cb = el('div', `task-cb${checked ? ' checked' : ''}`);
  cb.onclick = e => {
    e.stopPropagation();
    if (isRepeatInst) {
      toggleRepeatInstance(originDk, task.id, instanceDk);
    } else {
      toggleTask(dk, parentId||task.id, parentId ? task.id : null);
    }
  };
  item.appendChild(cb);

  const body = el('div', 'task-body');
  const txt = el('div', `task-text${checked ? ' done' : ''}`, { textContent: task.text });
  body.appendChild(txt);

  // Repeat badge
  if (!isSub && task.repeat && task.repeat !== 'none') {
    const badge = el('div', 'repeat-badge');
    badge.textContent = task.repeat === 'weekly' ? '🔄 매주' : '🔄 매월';
    body.appendChild(badge);
  }

  if (!isSub && task.subs && task.subs.length) {
    const subList = el('div', 'subtask-list');
    task.subs.forEach(s => subList.appendChild(buildTaskItem(dk, s, true, task.id, false, null, null)));
    body.appendChild(subList);
  }
  if (!isSub && !isRepeatInst) {
    const addSub = el('button', 'add-sub-btn', { textContent:'+ 하위 항목' });
    addSub.onclick = e => { e.stopPropagation(); activeInput = { dateKey: dk, parentId: task.id }; render(); };
    body.appendChild(addSub);
  }
  item.appendChild(body);

  const del = el('span', 'task-del', { textContent:'✕', title:'삭제' });
  del.onclick = e => {
    e.stopPropagation();
    if (isRepeatInst) {
      if (confirm('반복 태스크 전체를 삭제할까요?')) deleteRepeatTask(originDk, task.id);
    } else {
      const msg = task.repeat && task.repeat !== 'none'
        ? '반복 태스크 전체를 삭제할까요?' : '삭제하시겠습니까?';
      if (confirm(msg)) deleteTask(dk, parentId||task.id, parentId ? task.id : null);
    }
  };
  item.appendChild(del);
  return item;
}

// ── Build input form ──
function buildInputForm(dk, parentId) {
  let selColor = null, starred = false, selRepeat = 'none';
  const form = el('div', 'input-form');

  const row = el('div', 'input-row');
  const inp = el('input', 'task-input');
  inp.type = 'text'; inp.placeholder = '할 일 입력...';
  inp.id = `inp-${dk}-${parentId||'main'}`;
  row.appendChild(inp);
  if (!parentId) {
    const starBtn = el('button', 'star-toggle', { type:'button', textContent:'★', title:'중요' });
    starBtn.onclick = () => { starred = !starred; starBtn.classList.toggle('on', starred); };
    row.appendChild(starBtn);
  }
  form.appendChild(row);

  if (!parentId) {
    const cp = el('div', 'color-picker');
    const none = el('div', 'cp-dot selected');
    none.style.background = '#e8eaed'; none.title = '색 없음';
    none.onclick = () => { selColor = null; cp.querySelectorAll('.cp-dot').forEach(d => d.classList.remove('selected')); none.classList.add('selected'); };
    cp.appendChild(none);
    COLORS.forEach(c => {
      const dot = el('div', 'cp-dot'); dot.style.background = c.hex; dot.title = c.name;
      dot.onclick = () => { selColor = c.hex; cp.querySelectorAll('.cp-dot').forEach(d => d.classList.remove('selected')); dot.classList.add('selected'); };
      cp.appendChild(dot);
    });
    form.appendChild(cp);

    // Repeat selector
    const rs = el('div', 'repeat-selector');
    [['none','없음'],['weekly','매주 반복'],['monthly','매월 반복']].forEach(([val, label]) => {
      const btn = el('button', `repeat-opt${val === 'none' ? ' active' : ''}`, { type:'button', textContent: label });
      btn.onclick = () => {
        selRepeat = val;
        rs.querySelectorAll('.repeat-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
      rs.appendChild(btn);
    });
    form.appendChild(rs);
  }

  const actions = el('div', 'form-actions');
  const addBtn = el('button', 'btn-add', { type:'button', textContent:'추가' });
  const cancelBtn = el('button', 'btn-cancel', { type:'button', textContent:'취소' });
  addBtn.onclick = () => { const v = inp.value.trim(); if (v) addTask(dk, v, selColor, starred, selRepeat, parentId); else { activeInput = null; render(); } };
  cancelBtn.onclick = () => { activeInput = null; render(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); if (e.key === 'Escape') cancelBtn.click(); });
  actions.appendChild(addBtn); actions.appendChild(cancelBtn);
  form.appendChild(actions);
  return form;
}

function buildWeatherBar(dk) {
  const bar = el('div', 'weather-bar');
  const w = weatherByDate[dk];
  if (!w) {
    bar.appendChild(el('span', 'weather-loading', { textContent: '날씨 로드 중...' }));
  } else {
    const emojiEl = el('span', 'weather-emoji', { textContent: w.emoji });
    const info = el('div', 'weather-info');
    const temp = el('div', 'weather-temp');
    temp.innerHTML = `<span class="temp-max">${w.max}°</span> / <span class="temp-min">${w.min}°</span>`;
    const desc = el('div', 'weather-desc', { textContent: w.desc });
    info.appendChild(temp); info.appendChild(desc);
    if (w.rain > 0) {
      info.appendChild(el('div', 'weather-rain', { textContent: `💧 ${w.rain}%` }));
    }
    bar.appendChild(emojiEl); bar.appendChild(info);
  }
  return bar;
}

// ── Build day column ──
function buildDayCol(date, dayIdx) {
  const dk = dateKey(date);
  const isToday = date.getTime() === today().getTime();
  const isWeekend = dayIdx >= 5;
  const col = el('div', `day-col${isToday?' is-today':''}${isWeekend?' is-weekend':''}`);

  // Header
  const hdr = el('div', 'day-header');
  hdr.appendChild(el('div', 'day-name', { textContent: DAY_NAMES[dayIdx]+'요일' }));
  const numWrap = el('div', 'day-num-wrap');
  numWrap.appendChild(el('div', 'day-num', { textContent: date.getDate() }));
  hdr.appendChild(numWrap);
  hdr.appendChild(el('div', 'day-month', { textContent: `${date.getMonth()+1}월` }));
  col.appendChild(hdr);

  // Tasks
  const list = el('div', 'tasks-list');
  const dayTasks = (tasks[dk]||[]).slice().sort((a,b) => (b.starred?1:0)-(a.starred?1:0));
  dayTasks.forEach(t => list.appendChild(buildTaskItem(dk, t, false, null, false, null, null)));

  // Repeat instances
  getRepeatTasksForDate(date, dayIdx).forEach(({ task, originDk, instanceDk }) => {
    list.appendChild(buildTaskItem(dk, task, false, null, true, originDk, instanceDk));
  });

  // Sub-task input (inside a task)
  const ai = activeInput;
  if (ai && ai.dateKey === dk && ai.parentId) {
    list.appendChild(buildInputForm(dk, ai.parentId));
  }
  col.appendChild(list);

  // Add task / input form
  if (ai && ai.dateKey === dk && !ai.parentId) {
    col.appendChild(buildInputForm(dk, null));
  } else {
    const addBtn = el('button', 'add-task-btn', { innerHTML:'+ 할 일 추가' });
    addBtn.onclick = () => { activeInput = { dateKey: dk, parentId: null }; render(); };
    col.appendChild(addBtn);
  }

  // Weather bar
  col.appendChild(buildWeatherBar(dk));
  return col;
}

// ── Progress ──
function calcProgress() {
  let total = 0, done = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const dk = dateKey(d);
    (tasks[dk]||[]).forEach(t => {
      total++; if (t.checked) done++;
      (t.subs||[]).forEach(s => { total++; if (s.checked) done++; });
    });
  }
  return { total, done };
}

// ── Render ──
function render() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const end = new Date(weekStart); end.setDate(end.getDate() + 6);
  document.getElementById('weekLabel').textContent =
    `${weekStart.getFullYear()}년 ${weekStart.getMonth()+1}월 ${weekStart.getDate()}일 ~ ${end.getMonth()+1}월 ${end.getDate()}일`;

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    grid.appendChild(buildDayCol(d, i));
  }

  const { total, done } = calcProgress();
  const pct = total ? Math.round(done/total*100) : 0;
  const pi = document.getElementById('progressInfo');
  pi.innerHTML = total > 0
    ? `완료 ${done}/${total} <span class="progress-bar-wrap"><span class="progress-bar-fill" style="width:${pct}%"></span></span>`
    : '';

  if (activeInput) {
    setTimeout(() => {
      const inp = document.getElementById(`inp-${activeInput.dateKey}-${activeInput.parentId||'main'}`);
      if (inp) inp.focus();
    }, 30);
  }
}

// ── Navigation ──
document.getElementById('prevBtn').onclick = () => { weekStart.setDate(weekStart.getDate()-7); render(); };
document.getElementById('nextBtn').onclick = () => { weekStart.setDate(weekStart.getDate()+7); render(); };
document.getElementById('todayBtn').onclick = () => { weekStart = getMonday(new Date()); render(); };
document.getElementById('locationBtn').onclick = requestLocation;

// ── Init ──
render();
fetchWeather(weatherLocation.lat, weatherLocation.lon);
</script>
</body>
