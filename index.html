<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캘린더 태스크</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      gap: 12px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a73e8;
      white-space: nowrap;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #444;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #f5f5f5; }

    .today-btn {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }
    .today-btn:hover { background: #1557b0; }

    .week-label {
      font-size: 14px;
      font-weight: 600;
      min-width: 160px;
      text-align: center;
      color: #444;
    }

    /* ── Calendar grid ── */
    .calendar-wrap {
      padding: 16px;
      overflow-x: auto;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(130px, 1fr));
      gap: 8px;
      min-width: 940px;
    }

    .day-col {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      overflow: hidden;
    }
    .day-col.is-today { border: 2px solid #1a73e8; }
    .day-col.is-weekend { background: #fafafa; }

    /* ── Day header ── */
    .day-header {
      padding: 10px 10px 8px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .day-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .is-weekend .day-name { color: #e05252; }

    .day-num-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }
    .is-today .day-num-wrap {
      background: #1a73e8;
    }

    .day-num {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      color: #333;
    }
    .is-today .day-num { color: #fff; }
    .is-weekend:not(.is-today) .day-num { color: #e05252; }

    .day-month {
      font-size: 10px;
      color: #bbb;
      margin-top: 2px;
    }

    /* ── Tasks list ── */
    .tasks-list {
      flex: 1;
      padding: 6px 6px 0;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      padding: 4px 3px;
      border-radius: 5px;
      position: relative;
    }
    .task-item:hover { background: #f8f9fa; }
    .task-item:hover .task-del { opacity: 1; }

    .task-star {
      font-size: 13px;
      cursor: pointer;
      color: #ddd;
      flex-shrink: 0;
      margin-top: 1px;
      transition: color 0.15s;
      user-select: none;
    }
    .task-star.on { color: #f9a825; }
    .task-star:hover { color: #f9a825; }

    .color-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .task-cb {
      width: 14px;
      height: 14px;
      border: 1.5px solid #bbb;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      transition: background 0.15s, border-color 0.15s;
    }
    .task-cb.checked { background: #43a047; border-color: #43a047; }
    .task-cb.checked::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 700; }

    .task-body { flex: 1; min-width: 0; }

    .task-text {
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }
    .task-text.done { text-decoration: line-through; color: #bbb; }

    .task-del {
      font-size: 11px;
      color: #f44336;
      cursor: pointer;
      opacity: 0;
      flex-shrink: 0;
      padding: 0 2px;
      transition: opacity 0.15s;
      user-select: none;
    }

    /* sub-tasks */
    .subtask-list { margin-top: 2px; }

    .task-item.sub {
      margin-left: 18px;
    }
    .task-item.sub .task-cb {
      width: 12px;
      height: 12px;
    }
    .task-item.sub .task-text { font-size: 11px; color: #555; }

    .add-sub-btn {
      display: none;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: #aaa;
      cursor: pointer;
      margin: 2px 0 0 18px;
      background: none;
      border: none;
      padding: 1px 4px;
    }
    .task-item:hover .add-sub-btn { display: flex; }
    .add-sub-btn:hover { color: #1a73e8; }

    /* ── Add task button ── */
    .add-task-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      width: calc(100% - 12px);
      margin: 6px;
      padding: 5px 8px;
      border: 1.5px dashed #ddd;
      border-radius: 6px;
      background: none;
      font-size: 12px;
      color: #bbb;
      cursor: pointer;
      transition: all 0.15s;
    }
    .add-task-btn:hover {
      border-color: #1a73e8;
      color: #1a73e8;
      background: #f0f6ff;
    }

    /* ── Input form ── */
    .input-form {
      padding: 6px 8px 8px;
      border-top: 1px solid #f0f0f0;
    }

    .input-row {
      display: flex;
      gap: 4px;
      margin-bottom: 5px;
    }

    .task-input {
      flex: 1;
      border: 1px solid #dadce0;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .task-input:focus { border-color: #1a73e8; }

    .star-toggle {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #ddd;
      line-height: 1;
      transition: color 0.15s;
      padding: 0 2px;
    }
    .star-toggle.on { color: #f9a825; }

    .color-picker {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .cp-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
    }
    .cp-dot:hover { transform: scale(1.15); }
    .cp-dot.selected { border-color: #333; }

    .form-actions {
      display: flex;
      gap: 5px;
    }

    .btn-add {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add:hover { background: #1557b0; }

    .btn-cancel {
      background: #fff;
      color: #666;
      border: 1px solid #dadce0;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel:hover { background: #f5f5f5; }

    /* ── Progress bar in header ── */
    .progress-info {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }
    .progress-bar-wrap {
      width: 80px;
      height: 6px;
      background: #e8eaed;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #43a047;
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">📅 캘린더 태스크</div>
  <div class="week-nav">
    <button class="nav-btn" id="prevBtn">◀ 이전</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" id="nextBtn">다음 ▶</button>
    <button class="nav-btn today-btn" id="todayBtn">오늘</button>
  </div>
  <div class="progress-info" id="progressInfo"></div>
</header>

<div class="calendar-wrap">
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<script>
// ── Constants ──
const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];
const COLORS = [
  { hex: '#1a73e8', name: '파랑' },
  { hex: '#e53935', name: '빨강' },
  { hex: '#f9a825', name: '노랑' },
  { hex: '#43a047', name: '초록' },
  { hex: '#8e24aa', name: '보라' },
  { hex: '#fb8c00', name: '주황' },
  { hex: '#607d8b', name: '회색' },
];

// ── State ──
let weekStart = getMonday(new Date());
let tasks = loadTasks();
let activeInput = null; // { dateKey, parentId|null }

// ── Persistence ──
function loadTasks() {
  try { return JSON.parse(localStorage.getItem('calTasks') || '{}'); }
  catch { return {}; }
}
function saveTasks() {
  localStorage.setItem('calTasks', JSON.stringify(tasks));
}

// ── Date helpers ──
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
  date.setHours(0, 0, 0, 0);
  return date;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// ── Task mutations ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function addTask(dk, text, color, starred, parentId) {
  if (!tasks[dk]) tasks[dk] = [];
  const t = { id: uid(), text, checked: false, starred: !!starred, color: color||null, subs: [] };
  if (parentId) {
    const p = tasks[dk].find(x => x.id === parentId);
    if (p) p.subs.push(t);
  } else {
    tasks[dk].push(t);
  }
  saveTasks();
  activeInput = null;
  render();
}

function toggleTask(dk, id, subId) {
  const list = tasks[dk] || [];
  if (subId) {
    const p = list.find(x => x.id === id);
    if (p) { const s = p.subs.find(x => x.id === subId); if (s) s.checked = !s.checked; }
  } else {
    const t = list.find(x => x.id === id);
    if (t) t.checked = !t.checked;
  }
  saveTasks();
  render();
}

function toggleStar(dk, id) {
  const t = (tasks[dk]||[]).find(x => x.id === id);
  if (t) { t.starred = !t.starred; saveTasks(); render(); }
}

function deleteTask(dk, id, subId) {
  if (!tasks[dk]) return;
  if (subId) {
    const p = tasks[dk].find(x => x.id === id);
    if (p) p.subs = p.subs.filter(x => x.id !== subId);
  } else {
    tasks[dk] = tasks[dk].filter(x => x.id !== id);
  }
  saveTasks();
  render();
}

// ── DOM builders ──
function el(tag, cls, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) Object.assign(e, attrs);
  return e;
}

function buildTaskItem(dk, task, isSub, parentId) {
  const item = el('div', `task-item${isSub ? ' sub' : ''}`);

  // Star (main only)
  if (!isSub) {
    const star = el('span', `task-star${task.starred ? ' on' : ''}`, { textContent: '★', title: '중요 표시' });
    star.onclick = e => { e.stopPropagation(); toggleStar(dk, task.id); };
    item.appendChild(star);
  }

  // Color dot
  if (task.color) {
    const dot = el('div', 'color-dot');
    dot.style.background = task.color;
    item.appendChild(dot);
  }

  // Checkbox
  const cb = el('div', `task-cb${task.checked ? ' checked' : ''}`);
  cb.onclick = e => { e.stopPropagation(); toggleTask(dk, parentId||task.id, parentId ? task.id : null); };
  item.appendChild(cb);

  // Body
  const body = el('div', 'task-body');
  const txt = el('div', `task-text${task.checked ? ' done' : ''}`, { textContent: task.text });
  body.appendChild(txt);

  // Sub-tasks
  if (!isSub && task.subs && task.subs.length) {
    const subList = el('div', 'subtask-list');
    task.subs.forEach(s => subList.appendChild(buildTaskItem(dk, s, true, task.id)));
    body.appendChild(subList);
  }

  // Add sub button
  if (!isSub) {
    const addSub = el('button', 'add-sub-btn', { textContent: '+ 하위 항목' });
    addSub.onclick = e => { e.stopPropagation(); activeInput = { dateKey: dk, parentId: task.id }; render(); };
    body.appendChild(addSub);
  }

  item.appendChild(body);

  // Delete
  const del = el('span', 'task-del', { textContent: '✕', title: '삭제' });
  del.onclick = e => {
    e.stopPropagation();
    if (confirm('삭제하시겠습니까?')) deleteTask(dk, parentId||task.id, parentId ? task.id : null);
  };
  item.appendChild(del);

  return item;
}

function buildInputForm(dk, parentId) {
  let selColor = null;
  let starred = false;

  const form = el('div', 'input-form');

  const row = el('div', 'input-row');
  const inp = el('input', 'task-input');
  inp.type = 'text';
  inp.placeholder = '할 일 입력...';
  inp.id = `inp-${dk}-${parentId||'main'}`;
  row.appendChild(inp);

  if (!parentId) {
    const starBtn = el('button', 'star-toggle', { type: 'button', textContent: '★', title: '중요 표시' });
    starBtn.onclick = () => { starred = !starred; starBtn.classList.toggle('on', starred); };
    row.appendChild(starBtn);
  }
  form.appendChild(row);

  // Color picker (main only)
  if (!parentId) {
    const cp = el('div', 'color-picker');
    // None
    const none = el('div', 'cp-dot selected');
    none.style.background = '#e8eaed';
    none.title = '색 없음';
    none.onclick = () => { selColor = null; cp.querySelectorAll('.cp-dot').forEach(d => d.classList.remove('selected')); none.classList.add('selected'); };
    cp.appendChild(none);

    COLORS.forEach(c => {
      const dot = el('div', 'cp-dot');
      dot.style.background = c.hex;
      dot.title = c.name;
      dot.onclick = () => { selColor = c.hex; cp.querySelectorAll('.cp-dot').forEach(d => d.classList.remove('selected')); dot.classList.add('selected'); };
      cp.appendChild(dot);
    });
    form.appendChild(cp);
  }

  const actions = el('div', 'form-actions');
  const addBtn = el('button', 'btn-add', { type: 'button', textContent: '추가' });
  const cancelBtn = el('button', 'btn-cancel', { type: 'button', textContent: '취소' });

  addBtn.onclick = () => { const v = inp.value.trim(); if (v) addTask(dk, v, selColor, starred, parentId); else { activeInput = null; render(); } };
  cancelBtn.onclick = () => { activeInput = null; render(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); if (e.key === 'Escape') cancelBtn.click(); });

  actions.appendChild(addBtn);
  actions.appendChild(cancelBtn);
  form.appendChild(actions);

  return form;
}

function buildDayCol(date, dayIdx) {
  const dk = dateKey(date);
  const isToday = date.getTime() === today().getTime();
  const isWeekend = dayIdx >= 5;

  const col = el('div', `day-col${isToday ? ' is-today' : ''}${isWeekend ? ' is-weekend' : ''}`);

  // Header
  const hdr = el('div', 'day-header');
  const dayNameEl = el('div', 'day-name', { textContent: DAY_NAMES[dayIdx] + '요일' });
  const numWrap = el('div', 'day-num-wrap');
  const numEl = el('div', 'day-num', { textContent: date.getDate() });
  numWrap.appendChild(numEl);
  const mEl = el('div', 'day-month', { textContent: `${date.getMonth()+1}월` });
  hdr.appendChild(dayNameEl);
  hdr.appendChild(numWrap);
  hdr.appendChild(mEl);
  col.appendChild(hdr);

  // Tasks
  const list = el('div', 'tasks-list');
  const dayTasks = (tasks[dk] || []).slice().sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));
  dayTasks.forEach(t => list.appendChild(buildTaskItem(dk, t, false, null)));
  col.appendChild(list);

  // Sub-task input (nested inside a task)
  const ai = activeInput;
  if (ai && ai.dateKey === dk && ai.parentId) {
    const subForm = buildInputForm(dk, ai.parentId);
    subForm.style.cssText = 'padding: 4px 8px 8px 26px; border-top: none;';
    list.appendChild(subForm);
  }

  // Add task / input form
  if (ai && ai.dateKey === dk && !ai.parentId) {
    col.appendChild(buildInputForm(dk, null));
  } else {
    const addBtn = el('button', 'add-task-btn', { innerHTML: '+ 할 일 추가' });
    addBtn.onclick = () => { activeInput = { dateKey: dk, parentId: null }; render(); };
    col.appendChild(addBtn);
  }

  return col;
}

// ── Progress ──
function calcProgress() {
  let total = 0, done = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dk = dateKey(d);
    (tasks[dk] || []).forEach(t => {
      total++; if (t.checked) done++;
      (t.subs || []).forEach(s => { total++; if (s.checked) done++; });
    });
  }
  return { total, done };
}

// ── Render ──
function render() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const end = new Date(weekStart);
  end.setDate(end.getDate() + 6);
  document.getElementById('weekLabel').textContent =
    `${weekStart.getFullYear()}년 ${weekStart.getMonth()+1}월 ${weekStart.getDate()}일 ~ ${end.getMonth()+1}월 ${end.getDate()}일`;

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    grid.appendChild(buildDayCol(d, i));
  }

  // Progress
  const { total, done } = calcProgress();
  const pct = total ? Math.round(done / total * 100) : 0;
  const pi = document.getElementById('progressInfo');
  if (total > 0) {
    pi.innerHTML = `완료 ${done}/${total}
      <span class="progress-bar-wrap"><span class="progress-bar-fill" style="width:${pct}%"></span></span>`;
  } else {
    pi.textContent = '';
  }

  // Focus input
  if (activeInput) {
    setTimeout(() => {
      const id = `inp-${activeInput.dateKey}-${activeInput.parentId || 'main'}`;
      const inp = document.getElementById(id);
      if (inp) inp.focus();
    }, 30);
  }
}

// ── Navigation ──
document.getElementById('prevBtn').onclick = () => { weekStart.setDate(weekStart.getDate() - 7); render(); };
document.getElementById('nextBtn').onclick = () => { weekStart.setDate(weekStart.getDate() + 7); render(); };
document.getElementById('todayBtn').onclick = () => { weekStart = getMonday(new Date()); render(); };

// ── Init ──
render();
</script>
</body>
</html>
