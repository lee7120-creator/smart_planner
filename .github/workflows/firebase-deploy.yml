name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - smart-planner
      - gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Prepare Public Directory
        run: |
          mkdir public
          cp index.html app.js styles.css manifest.webmanifest sw.js icon* public/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_CALENDAR_1A589 }}
          projectId: my-calendar-1a589
          channelId: live
